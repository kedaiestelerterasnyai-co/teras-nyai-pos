<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>Admin Panel — Teras Nyai</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--bg1:#111;--bg2:#1a1a1a;--bg3:#222;--bg4:#2a2a2a;--b:#2a2a2a;--b2:#333;--tx:#f0ece4;--tx2:#888;--tx3:#555;--am:#f59e0b;--am2:#d97706;--amd:rgba(245,158,11,.12);--gn:#10b981;--gnd:rgba(16,185,129,.12);--rd:#ef4444;--rdd:rgba(239,68,68,.12);--bl:#3b82f6;--bld:rgba(59,130,246,.12);--pu:#8b5cf6;--pud:rgba(139,92,246,.12);--r:12px;--rsm:8px;--font:'Plus Jakarta Sans',sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--font);min-height:100vh}
button{cursor:pointer;font-family:var(--font)}
input,select,textarea{font-family:var(--font)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}

/* LAYOUT */
.shell{display:flex;min-height:100vh;min-height:100dvh}
.sidebar{width:220px;background:var(--bg1);border-right:1px solid var(--b);flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sidebar-logo{padding:20px 16px;border-bottom:1px solid var(--b)}
.sidebar-logo h1{font-size:16px;font-weight:700;color:var(--am)}
.sidebar-logo p{font-size:11px;color:var(--tx3);font-family:var(--mono);margin-top:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 16px;color:var(--tx2);font-size:13px;font-weight:500;cursor:pointer;border-left:3px solid transparent;transition:all .15s}
.nav-item:hover{color:var(--tx);background:var(--bg2)}
.nav-item.active{color:var(--am);background:var(--amd);border-left-color:var(--am)}
.nav-icon{font-size:16px;width:20px;text-align:center}
.sidebar-bottom{margin-top:auto;padding:16px;border-top:1px solid var(--b)}
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{background:var(--bg1);border-bottom:1px solid var(--b);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;flex-shrink:0}
.topbar-title{font-size:16px;font-weight:700}
.topbar-sub{font-size:12px;color:var(--tx2);margin-top:2px}
.content{padding:24px;flex:1;overflow-y:auto}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--b);border-radius:var(--r);margin-bottom:20px;overflow:hidden}
.card-head{padding:14px 18px;border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:12px;font-weight:700;color:var(--am);letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono)}
.card-body{padding:18px}

/* STATS ROW */
.stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--bg2);border:1px solid var(--b);border-radius:var(--r);padding:16px}
.stat-label{font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono);margin-bottom:6px}
.stat-val{font-size:24px;font-weight:700;font-family:var(--mono)}
.stat-sub{font-size:11px;color:var(--tx2);margin-top:4px}

/* TABLE */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;padding:10px 14px;border-bottom:1px solid var(--b);font-family:var(--mono)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--b);font-size:13px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--bg3)}
.tbl-mono{font-family:var(--mono);font-size:12px;color:var(--tx2)}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;font-family:var(--mono)}
.ba{background:var(--amd);color:var(--am)}.bg{background:var(--gnd);color:var(--gn)}.br{background:var(--rdd);color:var(--rd)}.bb{background:var(--bld);color:var(--bl)}.bp{background:var(--pud);color:var(--pu)}

/* BUTTONS */
.btn{border:none;border-radius:var(--rsm);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;cursor:pointer}
.btn-xs{padding:5px 10px;font-size:11px}
.btn-sm{padding:8px 14px;font-size:12px}
.btn-md{padding:11px 18px;font-size:14px}
.btn-lg{padding:13px 20px;font-size:15px}
.btn-amber{background:var(--am);color:#000}.btn-amber:hover{background:var(--am2)}
.btn-ghost{background:var(--bg3);border:1px solid var(--b2);color:var(--tx2)}.btn-ghost:hover{border-color:var(--am);color:var(--am)}
.btn-danger{background:var(--rdd);border:1px solid var(--rd);color:var(--rd)}.btn-danger:hover{background:var(--rd);color:#fff}
.btn-success{background:var(--gnd);border:1px solid var(--gn);color:var(--gn)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* FORMS */
.form-group{margin-bottom:16px}
.form-label{font-size:11px;font-weight:700;color:var(--tx2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;display:block;font-family:var(--mono)}
.form-input,.form-select{width:100%;background:var(--bg3);border:1.5px solid var(--b2);border-radius:var(--rsm);color:var(--tx);font-family:var(--font);font-size:14px;padding:10px 13px;outline:none;transition:border-color .2s;-webkit-appearance:none}
.form-input:focus,.form-select:focus{border-color:var(--am)}
.form-select option{background:var(--bg3)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--bg2);border:1px solid var(--b2);border-radius:var(--r);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg2)}
.modal-title{font-size:15px;font-weight:700}
.modal-close{background:none;border:none;color:var(--tx2);font-size:20px;padding:4px 8px;border-radius:6px}
.modal-close:hover{color:var(--rd)}
.modal-body{padding:20px}
.modal-footer{padding:16px 20px;border-top:1px solid var(--b);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:var(--bg2)}

/* SEARCH */
.search-box{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--b)}
.search-input{flex:1;background:var(--bg3);border:1.5px solid var(--b2);border-radius:var(--rsm);color:var(--tx);font-family:var(--font);font-size:13px;padding:8px 12px;outline:none;transition:border-color .2s}
.search-input:focus{border-color:var(--am)}

/* TOGGLE */
.toggle{position:relative;width:40px;height:22px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:var(--b2);border-radius:22px;transition:.3s;cursor:pointer}
.toggle-slider:before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.3s}
.toggle input:checked + .toggle-slider{background:var(--gn)}
.toggle input:checked + .toggle-slider:before{transform:translateX(18px)}

/* LOGIN */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
.login-box{background:var(--bg2);border:1px solid var(--b);border-radius:var(--r);padding:32px;width:100%;max-width:380px}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo h1{font-size:22px;font-weight:700;color:var(--am)}
.login-logo p{font-size:12px;color:var(--tx2);font-family:var(--mono);margin-top:4px}

/* TOAST */
.toast-wrap{position:fixed;top:20px;right:20px;z-index:100;display:flex;flex-direction:column;gap:8px}
.toast-item{background:var(--bg3);border:1.5px solid var(--b2);border-radius:var(--rsm);padding:11px 16px;font-size:13px;font-family:var(--mono);box-shadow:0 4px 20px rgba(0,0,0,.4);animation:slideIn .2s ease;display:flex;align-items:center;gap:8px}
.toast-item.ok{border-color:var(--gn);color:var(--gn)}
.toast-item.err{border-color:var(--rd);color:var(--rd)}
.toast-item.info{border-color:var(--bl);color:var(--bl)}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}

/* EMPTY */
.empty{text-align:center;padding:48px 20px;color:var(--tx3)}
.empty-icon{font-size:40px;margin-bottom:12px;opacity:.3}
.empty-text{font-size:13px;font-family:var(--mono)}

/* CHIP */
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--b2);border-radius:6px;padding:3px 8px;font-size:11px;font-family:var(--mono);color:var(--tx2)}

/* RESPONSIVE */
@media(max-width:768px){
  .shell{flex-direction:column}
  .sidebar{width:100%;height:auto;position:fixed;bottom:0;left:0;right:0;top:auto;flex-direction:row;border-right:none;border-top:1px solid var(--b);z-index:50;overflow-x:auto;overflow-y:hidden}
  .sidebar-logo{display:none}
  .nav-item{flex-direction:column;gap:3px;padding:8px 6px;font-size:9px;border-left:none;border-top:3px solid transparent;flex-shrink:0;min-width:60px;justify-content:center;align-items:center;text-align:center}
  .nav-item.active{border-left:none;border-top-color:var(--am)}
  .nav-icon{font-size:20px;width:auto}
  .sidebar-bottom{display:none}
  .main{padding-bottom:70px}
  .topbar{padding:10px 14px}
  .topbar-sub{display:none}
  .topbar-title{font-size:14px}
  .form-row,.form-row-3{grid-template-columns:1fr}
  .stats-row{grid-template-columns:1fr 1fr}
  .content{padding:12px}
  .card-head{flex-wrap:wrap;gap:8px}
  .tbl th,.tbl td{padding:9px 10px;font-size:12px}
  .modal{border-radius:16px 16px 0 0;max-height:95vh}
  .overlay{align-items:flex-end;padding:0}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

const SUPA_URL = 'https://xaixkcaeufxesqmdzhuv.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhhaXhrY2FldWZ4ZXNxbWR6aHV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5Njc1NzUsImV4cCI6MjA5NDU0MzU3NX0.nrFYxWfn8kA1JV6wyiW1X6KVRxKJi6yBnMPAGVIPTjY';
const ADMIN_PIN = '9999'; // Ganti PIN admin di sini

const db = {
  async get(table, opts={}) {
    let url = `${SUPA_URL}/rest/v1/${table}?`;
    if (opts.select) url += `select=${encodeURIComponent(opts.select)}&`;
    if (opts.filter) url += `${opts.filter}&`;
    if (opts.order)  url += `order=${opts.order}&`;
    const r = await fetch(url, { headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}` } });
    return r.json();
  },
  async insert(table, data) {
    const r = await fetch(`${SUPA_URL}/rest/v1/${table}`, {
      method:'POST', headers:{ apikey:SUPA_KEY, Authorization:`Bearer ${SUPA_KEY}`, 'Content-Type':'application/json', Prefer:'return=representation' },
      body: JSON.stringify(data)
    });
    return r.json();
  },
  async update(table, id, data) {
    const r = await fetch(`${SUPA_URL}/rest/v1/${table}?id=eq.${id}`, {
      method:'PATCH', headers:{ apikey:SUPA_KEY, Authorization:`Bearer ${SUPA_KEY}`, 'Content-Type':'application/json', Prefer:'return=representation' },
      body: JSON.stringify(data)
    });
    return r.json();
  },
  async del(table, id) {
    const r = await fetch(`${SUPA_URL}/rest/v1/${table}?id=eq.${id}`, {
      method:'DELETE', headers:{ apikey:SUPA_KEY, Authorization:`Bearer ${SUPA_KEY}` }
    });
    return r.ok;
  },
  async count(table, filter='') {
    const url = `${SUPA_URL}/rest/v1/${table}?select=id${filter?'&'+filter:''}`;
    const r = await fetch(url, { headers: { apikey:SUPA_KEY, Authorization:`Bearer ${SUPA_KEY}`, Prefer:'count=exact' } });
    const ct = r.headers.get('content-range');
    return ct ? parseInt(ct.split('/')[1]) : 0;
  }
};

const fmt = n => 'Rp ' + Math.round(n||0).toLocaleString('id-ID');
const uid = () => Math.random().toString(36).slice(2,9).toUpperCase();

// ── TOAST ─────────────────────────────────────────────────────
function ToastContainer({ toasts }) {
  return <div className="toast-wrap">{toasts.map(t => <div key={t.id} className={`toast-item ${t.type}`}>{t.msg}</div>)}</div>;
}
function useToast() {
  const [toasts, setToasts] = useState([]);
  const show = useCallback((msg, type='info') => {
    const id = Date.now();
    setToasts(t => [...t, {id, msg, type}]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3000);
  }, []);
  return [toasts, show];
}

// ── LOGIN ─────────────────────────────────────────────────────
function LoginPage({ onLogin }) {
  const [pin, setPin] = useState('');
  const [err, setErr] = useState('');
  const handleSubmit = () => {
    if (pin === ADMIN_PIN) onLogin();
    else { setErr('PIN Admin salah'); setPin(''); }
  };
  return (
    <div className="login-wrap">
      <div className="login-box">
        <div className="login-logo">
          <div style={{fontSize:36,marginBottom:8}}>⚙️</div>
          <h1>Admin Panel</h1>
          <p>Teras Nyai POS — v2.0</p>
        </div>
        <div className="form-group">
          <label className="form-label">PIN Admin</label>
          <input className="form-input" type="password" placeholder="Masukkan PIN Admin" value={pin}
            onChange={e => setPin(e.target.value)} onKeyDown={e => e.key==='Enter' && handleSubmit()} autoFocus />
        </div>
        {err && <p style={{color:'var(--rd)',fontSize:12,marginBottom:10,fontFamily:'var(--mono)'}}>{err}</p>}
        <button className="btn btn-amber btn-lg" style={{width:'100%'}} onClick={handleSubmit}>MASUK ADMIN</button>
        <p style={{textAlign:'center',marginTop:12,fontSize:11,color:'var(--tx3)',fontFamily:'var(--mono)'}}>Default PIN: 9999 — ganti di baris ADMIN_PIN</p>
      </div>
    </div>
  );
}

// ── DASHBOARD ────────────────────────────────────────────────
function Dashboard({ toast }) {
  const [stats, setStats] = useState({ outlets:0, karyawan:0, menu:0, trx:0 });
  const [recentTrx, setRecent] = useState([]);

  useEffect(() => {
    Promise.all([
      db.count('outlets','aktif=eq.true'),
      db.count('karyawan','aktif=eq.true'),
      db.count('menu','aktif=eq.true'),
      db.count('transaksi'),
      db.get('transaksi', { select:'id,outlet_id,kasir_nama,total,metode_bayar,tgl,jam,status', order:'created_at.desc', filter:'limit=10' })
    ]).then(([o,k,m,t,rt]) => {
      setStats({ outlets:o, karyawan:k, menu:m, trx:t });
      setRecent(rt||[]);
    });
  }, []);

  const statCards = [
    { label:'Outlet Aktif', val:stats.outlets, color:'var(--am)', icon:'🏪' },
    { label:'Karyawan Aktif', val:stats.karyawan, color:'var(--bl)', icon:'👥' },
    { label:'Item Menu', val:stats.menu, color:'var(--pu)', icon:'🍽️' },
    { label:'Total Transaksi', val:stats.trx, color:'var(--gn)', icon:'🧾' },
  ];

  return (
    <div>
      <div className="stats-row">
        {statCards.map(s => (
          <div key={s.label} className="stat">
            <div style={{fontSize:24,marginBottom:6}}>{s.icon}</div>
            <div className="stat-label">{s.label}</div>
            <div className="stat-val" style={{color:s.color}}>{s.val}</div>
          </div>
        ))}
      </div>
      <div className="card">
        <div className="card-head"><span className="card-title">Transaksi Terbaru</span></div>
        <div style={{overflowX:'auto'}}>
          <table className="tbl">
            <thead><tr><th>ID Transaksi</th><th>Outlet</th><th>Kasir</th><th>Total</th><th>Metode</th><th>Status</th></tr></thead>
            <tbody>
              {recentTrx.length === 0 && <tr><td colSpan={6}><div className="empty"><div className="empty-icon">🧾</div><div className="empty-text">Belum ada transaksi</div></div></td></tr>}
              {recentTrx.map(t => (
                <tr key={t.id}>
                  <td><span className="tbl-mono">{t.id}</span></td>
                  <td><span className="chip">{t.outlet_id}</span></td>
                  <td>{t.kasir_nama}</td>
                  <td><span style={{fontFamily:'var(--mono)',fontWeight:600,color:'var(--am)'}}>{fmt(t.total)}</span></td>
                  <td><span className="badge bb">{t.metode_bayar}</span></td>
                  <td><span className={`badge ${t.status==='LUNAS'?'bg':'br'}`}>{t.status}</span></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ── MENU MANAGER ─────────────────────────────────────────────
function MenuManager({ toast }) {
  const [items, setItems] = useState([]);
  const [search, setSearch] = useState('');
  const [katFilter, setKat] = useState('Semua');
  const [modal, setModal] = useState(null);
  const [saving, setSaving] = useState(false);
  const [form, setForm] = useState({});
  const [showImport, setShowImport] = useState(false);
  const [sheetsUrl, setSheetsUrl] = useState('');
  const [importing, setImporting] = useState(false);
  const [importResult, setImportResult] = useState(null);

  const load = () => db.get('menu', { select:'*', order:'kategori,nama' }).then(d => setItems(d||[]));
  useEffect(() => { load(); }, []);

  const cats = useMemo(() => ['Semua', ...new Set(items.map(m => m.kategori))], [items]);
  const filtered = useMemo(() => items.filter(m => {
    const matchKat = katFilter === 'Semua' || m.kategori === katFilter;
    const matchSearch = !search || m.nama.toLowerCase().includes(search.toLowerCase());
    return matchKat && matchSearch;
  }), [items, katFilter, search]);

  const importFromSheets = async () => {
    if (!sheetsUrl) { toast('Masukkan URL Sheets', 'err'); return; }
    setImporting(true); setImportResult(null);
    try {
      // Convert URL Sheets ke CSV export URL
      let csvUrl = sheetsUrl;
      // Ekstrak spreadsheet ID dan gid
      const idMatch = sheetsUrl.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
      const gidMatch = sheetsUrl.match(/[?&#]gid=([0-9]+)/);
      if (idMatch) {
        const sheetId = idMatch[1];
        const gid = gidMatch ? gidMatch[1] : '0';
        csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}`;
      }
      const res = await fetch(csvUrl);
      if (!res.ok) throw new Error('Gagal mengakses Sheets. Pastikan sharing diset ke "Anyone with link"');
      const text = await res.text();
      const rows = text.trim().split('\n').map(r => r.split(',').map(c => c.replace(/^"|"$/g,'').trim()));
      // Deteksi header row
      const hasHeader = rows[0][0].toLowerCase().includes('id') || rows[0][0].toLowerCase().includes('menu');
      const dataRows = hasHeader ? rows.slice(1) : rows;
      if (!dataRows.length) throw new Error('Tidak ada data ditemukan');
      let inserted = 0, updated = 0, skipped = 0;
      for (const row of dataRows) {
        if (!row[0] || !row[1]) { skipped++; continue; }
        const menuData = {
          id: row[0].trim(),
          nama: row[1].trim(),
          kategori: row[2]?.trim() || 'Lainnya',
          harga: parseInt(row[3]?.replace(/[^0-9]/g,'')) || 0,
          hpp: parseInt(row[4]?.replace(/[^0-9]/g,'')) || 0,
          aktif: row[5]?.trim().toUpperCase() !== 'FALSE'
        };
        if (!menuData.id || !menuData.nama || !menuData.harga) { skipped++; continue; }
        // Cek apakah ID sudah ada
        const existing = items.find(m => m.id === menuData.id);
        if (existing) {
          await db.update('menu', menuData.id, { nama:menuData.nama, kategori:menuData.kategori, harga:menuData.harga, hpp:menuData.hpp, aktif:menuData.aktif });
          updated++;
        } else {
          await db.insert('menu', menuData);
          inserted++;
        }
      }
      setImportResult({ ok:true, msg:`✓ Import selesai: ${inserted} ditambahkan, ${updated} diupdate, ${skipped} dilewati` });
      load();
      toast(`Import Sheets berhasil! ${inserted + updated} item diproses`, 'ok');
    } catch(e) {
      setImportResult({ ok:false, msg:'✗ ' + e.message });
      toast('Import gagal: ' + e.message, 'err');
    }
    setImporting(false);
  };

    setForm({ id:'MNU-'+uid(), nama:'', kategori:'', harga:'', hpp:'', aktif:true });
    setModal({ mode:'add' });
  };
  const openEdit = (m) => { setForm({ ...m }); setModal({ mode:'edit' }); };
  const closeModal = () => { setModal(null); setForm({}); };

  const handleSave = async () => {
    if (!form.nama || !form.harga) { toast('Nama dan harga wajib diisi', 'err'); return; }
    setSaving(true);
    const data = { id:form.id, nama:form.nama.trim(), kategori:form.kategori.trim(), harga:+form.harga, hpp:+form.hpp||0, aktif:form.aktif };

    toast(`Menu ${m.aktif?'dinonaktifkan':'diaktifkan'}`, m.aktif?'err':'ok');

  return (
    <div>

        {showImport && (
          <div style={{padding:'14px 18px',borderBottom:'1px solid var(--b)',background:'var(--bg3)'}}>

            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              <input
                className="search-input" style={{flex:1,minWidth:200}}

                onChange={e => setSheetsUrl(e.target.value)}
              />
              <button className="btn btn-success btn-sm" onClick={importFromSheets} disabled={importing}>
                {importing ? '⏳ Memuat...' : '🔄 Import Sekarang'}
              </button>
            </div>
            <div style={{fontSize:11,color:'var(--tx3)',marginTop:8,fontFamily:'var(--mono)'}}>
              Format kolom Sheets: menu_id | nama_menu | kategori | harga_jual | hpp | aktif

            {importResult && (
              <div style={{marginTop:8,padding:'8px 12px',borderRadius:6,background: importResult.ok?'var(--gnd)':'var(--rdd)',color:importResult.ok?'var(--gn)':'var(--rd)',fontFamily:'var(--mono)',fontSize:12}}>
                {importResult.msg}
              </div>

        <div className="search-box">
          <input className="search-input" placeholder="Cari nama menu..." value={search} onChange={e => setSearch(e.target.value)} />

            {cats.map(c => <option key={c} value={c}>{c}</option>)}

        </div>
        <div style={{overflowX:'auto'}}>
          <table className="tbl">

                  <td><span className="tbl-mono">{m.id}</span></td>
                  <td style={{fontWeight:500}}>{m.nama}</td>
                  <td><span className="badge bp">{m.kategori}</span></td>
                  <td><span style={{fontFamily:'var(--mono)',color:'var(--am)',fontWeight:600}}>{fmt(m.harga)}</span></td>

      db.get('outlets', { select:'id,nama', filter:'aktif=eq.true' })

    setForm({ id:'EMP-'+uid(), nama:'', jabatan:'Crew Store', outlet_id:'', pin:'1234', aktif:true });

  useEffect(() => {
    db.get('outlets', { select:'id,nama' }).then(d => setOutlets(d||[]));
    loadData();
  }, []);

  const loadData = async () => {
    setLoad(true);
    let f = `tgl=gte.${filter.tgl_dari}&tgl=lte.${filter.tgl_sampai}`;
    if (filter.outlet) f += `&outlet_id=eq.${filter.outlet}`;

    setTrx(d||[]); setLoad(false);
  };

  const totalPenjualan = trx.reduce((s,t) => s+t.total, 0);
  const totalHPP       = trx.reduce((s,t) => s+t.hpp_total, 0);
  const grossProfit    = trx.reduce((s,t) => s+t.gross_profit, 0);

  return (
    <div>
      <div className="card">
        <div className="card-head"><span className="card-title">Filter Laporan</span></div>

          <div className="form-row-3">

            <div className="form-group" style={{marginBottom:0}}>
              <label className="form-label">Sampai Tanggal</label>
              <input className="form-input" type="date" value={filter.tgl_sampai} onChange={e=>setFilter(f=>({...f,tgl_sampai:e.target.value}))} />
            </div>
            <div className="form-group" style={{marginBottom:0}}>
              <label className="form-label">Outlet</label>
              <select className="form-select" value={filter.outlet} onChange={e=>setFilter(f=>({...f,outlet:e.target.value}))}>
                <option value="">Semua Outlet</option>
                {outlets.map(o => <option key={o.id} value={o.id}>{o.nama}</option>)}
              </select>
            </div>
          </div>
          <div style={{marginTop:14}}>
            <button className="btn btn-amber btn-md" onClick={loadData} disabled={loading}>{loading?'Memuat...':'Tampilkan Laporan'}</button>
          </div>
        </div>
      </div>

      <div className="stats-row">
        <div className="stat"><div className="stat-label">Total Transaksi</div><div className="stat-val" style={{color:'var(--bl)'}}>{trx.length}</div></div>
        <div className="stat"><div className="stat-label">Total Penjualan</div><div className="stat-val" style={{color:'var(--am)',fontSize:18}}>{fmt(totalPenjualan)}</div></div>
        <div className="stat"><div className="stat-label">Total HPP</div><div className="stat-val" style={{color:'var(--rd)',fontSize:18}}>{fmt(totalHPP)}</div></div>
        <div className="stat"><div className="stat-label">Gross Profit</div><div className="stat-val" style={{color:'var(--gn)',fontSize:18}}>{fmt(grossProfit)}</div></div>
      </div>

      <div className="card">
        <div className="card-head">
          <span className="card-title">Data Transaksi ({trx.length})</span>
        </div>
        <div style={{overflowX:'auto'}}>
          <table className="tbl">
            <thead><tr><th>ID</th><th>Tgl</th><th>Outlet</th><th>Kasir</th><th>Total</th><th>HPP</th><th>Profit</th><th>Metode</th><th>Status</th></tr></thead>
            <tbody>
              {trx.length === 0 && <tr><td colSpan={9}><div className="empty"><div className="empty-icon">🧾</div><div className="empty-text">Tidak ada data</div></div></td></tr>}
              {trx.map(t => (
                <tr key={t.id}>
                  <td><span className="tbl-mono" style={{fontSize:11}}>{t.id}</span></td>
                  <td><span className="tbl-mono">{t.tgl}</span></td>
                  <td><span className="chip">{t.outlet_id}</span></td>
                  <td>{t.kasir_nama}</td>
                  <td><span style={{fontFamily:'var(--mono)',color:'var(--am)',fontWeight:600}}>{fmt(t.total)}</span></td>
                  <td><span style={{fontFamily:'var(--mono)',color:'var(--tx2)'}}>{fmt(t.hpp_total)}</span></td>
                  <td><span style={{fontFamily:'var(--mono)',color:'var(--gn)'}}>{fmt(t.gross_profit)}</span></td>
                  <td><span className="badge bb">{t.metode_bayar}</span></td>
                  <td><span className={`badge ${t.status==='LUNAS'?'bg':'br'}`}>{t.status}</span></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────
const NAV = [
  { id:'dashboard',  label:'Dashboard',  icon:'📊' },
  { id:'menu',       label:'Master Menu', icon:'🍽️' },
  { id:'karyawan',   label:'Karyawan',   icon:'👥' },
  { id:'outlet',     label:'Outlet',     icon:'🏪' },
  { id:'laporan',    label:'Laporan',    icon:'📋' },
];

function App() {
  const [authed, setAuthed] = useState(false);
  const [page, setPage]     = useState('dashboard');
  const [toasts, showToast] = useToast();

  if (!authed) return (
    <>
      <LoginPage onLogin={() => setAuthed(true)} />
      <ToastContainer toasts={toasts} />
    </>
  );

  const pageTitle = NAV.find(n => n.id === page);

  return (
    <div className="shell">
      <ToastContainer toasts={toasts} />
      <div className="sidebar">
        <div className="sidebar-logo">
          <h1>☕ Teras Nyai</h1>
          <p>Admin Panel v2.0</p>
        </div>
        {NAV.map(n => (
          <div key={n.id} className={`nav-item ${page===n.id?'active':''}`} onClick={() => setPage(n.id)}>
            <span className="nav-icon">{n.icon}</span>{n.label}
          </div>
        ))}
        <div className="sidebar-bottom">
          <a href="./index.html" style={{display:'flex',alignItems:'center',gap:8,color:'var(--tx2)',fontSize:12,textDecoration:'none',fontFamily:'var(--mono)'}}>
            ← Buka POS Kasir
          </a>
        </div>
      </div>
      <div className="main">
        <div className="topbar">
          <div>
            <div className="topbar-title">{pageTitle?.icon} {pageTitle?.label}</div>
            <div className="topbar-sub">Teras Nyai POS — Data disimpan ke Supabase</div>
          </div>
          <button className="btn btn-ghost btn-sm" onClick={() => setAuthed(false)}>Logout</button>
        </div>
        <div className="content">
          {page === 'dashboard' && <Dashboard toast={showToast} />}
          {page === 'menu'      && <MenuManager toast={showToast} />}
          {page === 'karyawan'  && <KaryawanManager toast={showToast} />}
          {page === 'outlet'    && <OutletManager toast={showToast} />}
          {page === 'laporan'   && <LaporanManager toast={showToast} />}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
