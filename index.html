<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>POS Teras Nyai</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<style>
:root {
  --c-bg:      #0a0a0a;
  --c-bg1:     #111111;
  --c-bg2:     #1a1a1a;
  --c-bg3:     #222222;
  --c-bg4:     #2a2a2a;
  --c-border:  #2a2a2a;
  --c-border2: #333333;
  --c-text:    #f0ece4;
  --c-text2:   #888888;
  --c-text3:   #555555;
  --c-amber:   #f59e0b;
  --c-amber2:  #d97706;
  --c-amberD:  rgba(245,158,11,.12);
  --c-green:   #10b981;
  --c-greenD:  rgba(16,185,129,.12);
  --c-red:     #ef4444;
  --c-redD:    rgba(239,68,68,.12);
  --c-blue:    #3b82f6;
  --c-blueD:   rgba(59,130,246,.12);
  --c-purple:  #8b5cf6;
  --c-purpleD: rgba(139,92,246,.12);
  --r:         12px;
  --r-sm:      8px;
  --shadow:    0 4px 24px rgba(0,0,0,.4);
  --font:      'Plus Jakarta Sans', sans-serif;
  --mono:      'JetBrains Mono', monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--c-bg);color:var(--c-text);font-family:var(--font)}#root{height:100%;overflow:hidden}
button{cursor:pointer;font-family:var(--font);touch-action:manipulation}
input,select,textarea{font-family:var(--font)}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--c-border2);border-radius:2px}

/* ── LAYOUT ── */
.app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;position:relative;background:var(--c-bg)}
.topbar{background:var(--c-bg1);border-bottom:1px solid var(--c-border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-brand{font-size:13px;font-weight:700;color:var(--c-amber);letter-spacing:.02em}
.topbar-info{font-size:11px;color:var(--c-text2);font-family:var(--mono);text-align:center}
.topbar-info strong{color:var(--c-text);font-size:12px;display:block}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.navbar{background:var(--c-bg1);border-top:1px solid var(--c-border);display:flex;flex-shrink:0}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px 4px;background:none;border:none;color:var(--c-text3);font-size:10px;font-weight:500;border-top:2px solid transparent;transition:all .15s}
.nav-btn.active{color:var(--c-amber);border-top-color:var(--c-amber)}
.nav-btn i{font-size:18px}

/* ── CARDS ── */
.card{background:var(--c-bg2);border:1px solid var(--c-border);border-radius:var(--r);margin:0 12px 10px;overflow:hidden}
.card-head{padding:12px 14px;border-bottom:1px solid var(--c-border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:11px;font-weight:600;color:var(--c-amber);letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono)}
.card-body{padding:14px}

/* ── FORMS ── */
.form-group{margin-bottom:14px}
.form-label{font-size:11px;font-weight:600;color:var(--c-text2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;display:block;font-family:var(--mono)}
.form-input,.form-select{width:100%;background:var(--c-bg3);border:1.5px solid var(--c-border2);border-radius:var(--r-sm);color:var(--c-text);font-family:var(--font);font-size:14px;padding:11px 13px;outline:none;transition:border-color .2s;-webkit-appearance:none}
.form-input:focus,.form-select:focus{border-color:var(--c-amber)}
.form-select option{background:var(--c-bg3)}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;font-family:var(--mono)}
.badge-amber{background:var(--c-amberD);color:var(--c-amber)}
.badge-green{background:var(--c-greenD);color:var(--c-green)}
.badge-red{background:var(--c-redD);color:var(--c-red)}
.badge-blue{background:var(--c-blueD);color:var(--c-blue)}
.badge-purple{background:var(--c-purpleD);color:var(--c-purple)}

/* ── BUTTONS ── */
.btn{border:none;border-radius:var(--r-sm);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;touch-action:manipulation}
.btn-xs{padding:5px 10px;font-size:11px}
.btn-sm{padding:8px 14px;font-size:12px}
.btn-md{padding:11px 18px;font-size:14px}
.btn-lg{padding:15px 20px;font-size:15px;font-weight:700}
.btn-full{width:100%}
.btn-amber{background:var(--c-amber);color:#000}
.btn-amber:active{background:var(--c-amber2)}
.btn-ghost{background:var(--c-bg3);border:1.5px solid var(--c-border2);color:var(--c-text2)}
.btn-ghost:active{border-color:var(--c-amber);color:var(--c-amber)}
.btn-danger{background:var(--c-redD);border:1.5px solid var(--c-red);color:var(--c-red)}
.btn-success{background:var(--c-greenD);border:1.5px solid var(--c-green);color:var(--c-green)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ── LOGIN ── */
.login-wrap{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:100dvh;background:var(--c-bg);padding:16px 16px 32px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.login-wrap{padding-top:env(safe-area-inset-top,16px)}
.login-logo{margin-bottom:16px;text-align:center;margin-top:16px}
.login-logo-icon{width:56px;height:56px;background:var(--c-amberD);border:2px solid var(--c-amber);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:26px}
.login-logo h1{font-size:20px;font-weight:700;color:var(--c-text)}
.login-logo p{font-size:11px;color:var(--c-text2);margin-top:2px;font-family:var(--mono)}
.login-box{width:100%;max-width:360px;padding-bottom:24px}
.pin-display{font-family:var(--mono);font-size:24px;letter-spacing:.4em;text-align:center;padding:11px 0;color:var(--c-amber);min-height:50px;background:var(--c-bg2);border:1.5px solid var(--c-border2);border-radius:var(--r);margin-bottom:10px}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.pin-key{background:var(--c-bg2);border:1.5px solid var(--c-border2);border-radius:var(--r);color:var(--c-text);font-family:var(--mono);font-size:20px;font-weight:600;padding:13px 0;text-align:center;transition:all .12s;-webkit-tap-highlight-color:transparent}
.pin-key:active{background:var(--c-bg3);border-color:var(--c-amber);transform:scale(.97)}

/* ── MENU GRID ── */
.cat-pills{display:flex;gap:7px;overflow-x:auto;padding:10px 12px;scrollbar-width:none;position:sticky;top:0;z-index:10;background:var(--c-bg);border-bottom:1px solid var(--c-border)}
.cat-pills::-webkit-scrollbar{display:none}
.cat-pill{flex-shrink:0;background:var(--c-bg3);border:1.5px solid var(--c-border2);border-radius:20px;color:var(--c-text2);font-size:12px;font-weight:500;padding:6px 14px;cursor:pointer;transition:all .12s;white-space:nowrap}
.cat-pill.active{background:var(--c-amberD);border-color:var(--c-amber);color:var(--c-amber)}
.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 12px 12px}
.menu-card{background:var(--c-bg2);border:1.5px solid var(--c-border);border-radius:var(--r);padding:12px 8px;text-align:center;cursor:pointer;transition:all .12s;user-select:none;position:relative;overflow:hidden}
.menu-card:active{transform:scale(.97);border-color:var(--c-amber);background:var(--c-amberD)}
.menu-card-cat{font-size:9px;color:var(--c-text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;font-family:var(--mono)}
.menu-card-name{font-size:12px;font-weight:600;line-height:1.3;margin-bottom:5px;color:var(--c-text)}
.menu-card-price{font-size:12px;font-weight:700;color:var(--c-amber);font-family:var(--mono)}
.menu-card-hpp{font-size:9px;color:var(--c-text3);font-family:var(--mono);margin-top:2px}

/* ── CART ── */
.cart-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--c-border)}
.cart-item:last-child{border-bottom:none}
.cart-item-info{flex:1;min-width:0}
.cart-item-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-item-sub{font-size:11px;color:var(--c-text2);font-family:var(--mono);margin-top:2px}
.qty-ctrl{display:flex;align-items:center;gap:8px;flex-shrink:0}
.qty-btn{width:28px;height:28px;background:var(--c-bg3);border:1.5px solid var(--c-border2);border-radius:8px;color:var(--c-text);font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .12s}
.qty-btn:active{border-color:var(--c-amber);color:var(--c-amber)}
.qty-val{font-family:var(--mono);font-size:14px;min-width:22px;text-align:center;font-weight:600}
.cart-price{font-family:var(--mono);font-size:13px;font-weight:600;min-width:68px;text-align:right;flex-shrink:0}

/* ── TOTAL BOX ── */
.total-box{background:var(--c-bg2);border:1.5px solid var(--c-border);border-radius:var(--r);margin:0 12px 10px;padding:14px}
.total-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-family:var(--mono);font-size:13px}
.total-row .l{color:var(--c-text2)}
.total-grand{font-size:18px;font-weight:700;color:var(--c-amber);border-top:1.5px solid var(--c-border2);margin-top:8px;padding-top:10px}

/* ── PAY METHODS ── */
.pay-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.pay-btn{background:var(--c-bg3);border:1.5px solid var(--c-border2);border-radius:var(--r-sm);padding:10px 4px;text-align:center;cursor:pointer;transition:all .12s;font-size:11px;font-weight:600;color:var(--c-text2)}
.pay-btn.active{background:var(--c-amberD);border-color:var(--c-amber);color:var(--c-amber)}
.pay-icon{font-size:18px;display:block;margin-bottom:3px}

/* ── STATS ── */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.stat-card{background:var(--c-bg2);border:1.5px solid var(--c-border);border-radius:var(--r);padding:14px}
.stat-label{font-size:10px;font-weight:600;color:var(--c-text3);text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono);margin-bottom:6px}
.stat-value{font-size:20px;font-weight:700;font-family:var(--mono)}
.stat-sub{font-size:11px;color:var(--c-text2);margin-top:3px}

/* ── LIST ITEMS ── */
.list-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--c-border)}
.list-item:last-child{border-bottom:none}
.list-item-left .title{font-size:14px;font-weight:500}
.list-item-left .sub{font-size:11px;color:var(--c-text2);font-family:var(--mono);margin-top:2px}

/* ── ABSEN CARDS ── */
.absen-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
.absen-card{background:var(--c-bg3);border:1.5px solid var(--c-border2);border-radius:var(--r);padding:16px;text-align:center;cursor:pointer;transition:all .15s}
.absen-card.masuk.done{background:var(--c-greenD);border-color:var(--c-green)}
.absen-card.pulang.done{background:var(--c-redD);border-color:var(--c-red)}
.absen-icon{font-size:28px;margin-bottom:8px}
.absen-time{font-family:var(--mono);font-size:18px;font-weight:700;margin-bottom:4px}
.absen-label{font-size:12px;font-weight:600;color:var(--c-text2)}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--c-bg1);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:20px 16px;max-height:90dvh;overflow-y:auto}
.modal-handle{width:36px;height:3px;background:var(--c-border2);border-radius:2px;margin:0 auto 18px}
.modal-title{font-size:14px;font-weight:700;color:var(--c-amber);margin-bottom:16px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em}

/* ── TOAST ── */
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--c-bg3);border:1.5px solid var(--c-border2);border-radius:var(--r);padding:11px 18px;font-size:13px;font-family:var(--mono);opacity:0;transition:all .25s;z-index:100;white-space:nowrap;pointer-events:none;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:var(--c-green);color:var(--c-green)}
.toast.err{border-color:var(--c-red);color:var(--c-red)}

/* ── STRUK ── */
.struk{font-family:var(--mono);font-size:13px;line-height:1.9}
.struk-row{display:flex;justify-content:space-between}
.struk-divider{border-top:1px dashed var(--c-border2);margin:8px 0}

/* ── SYNC DOT ── */
.sync-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;transition:background .3s}
.sync-dot.ok{background:var(--c-green)}
.sync-dot.err{background:var(--c-red)}
.sync-dot.ld{background:var(--c-amber);animation:blink .8s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:48px 20px;color:var(--c-text3)}
.empty-icon{font-size:40px;margin-bottom:12px;opacity:.35}
.empty-text{font-size:13px;font-family:var(--mono)}

/* ── LOGOUT BTN ── */
.logout-btn{background:none;border:1.5px solid var(--c-border2);border-radius:var(--r-sm);color:var(--c-text2);font-size:11px;font-family:var(--mono);padding:6px 11px;transition:all .15s}
.logout-btn:active{border-color:var(--c-red);color:var(--c-red)}

/* ── DISC INPUT ── */
.disc-input{width:74px;padding:5px 8px;font-size:13px;text-align:right;background:var(--c-bg3);border:1.5px solid var(--c-border2);border-radius:var(--r-sm);color:var(--c-text);font-family:var(--mono);outline:none}
.disc-input:focus{border-color:var(--c-amber)}

/* ── SECTION TITLE ── */
.section-title{font-size:11px;font-weight:700;color:var(--c-text3);text-transform:uppercase;letter-spacing:.08em;padding:14px 14px 6px;font-family:var(--mono)}

/* ── ORDER TYPE ── */
.order-types{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.order-type{background:var(--c-bg3);border:1.5px solid var(--c-border2);border-radius:var(--r-sm);padding:8px 4px;text-align:center;cursor:pointer;font-size:11px;font-weight:600;color:var(--c-text2);transition:all .12s}
.order-type.active{background:var(--c-blueD);border-color:var(--c-blue);color:var(--c-blue)}

/* ── VOID BADGE ── */
.void-btn{background:none;border:none;color:var(--c-red);font-size:11px;font-family:var(--mono);padding:3px 7px;border-radius:6px;background:var(--c-redD)}

/* ── TOP ── */
.page{padding-bottom:12px}
.page-header{padding:14px 14px 0;display:flex;align-items:center;justify-content:space-between}
.page-title{font-size:18px;font-weight:700}
.page-sub{font-size:12px;color:var(--c-text2);margin-top:2px}

/* bottom pay bar */
.pay-bar{position:sticky;bottom:0;padding:10px 12px;background:var(--c-bg1);border-top:1px solid var(--c-border)}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ── CONFIG ───────────────────────────────────────────────────
const SUPA_URL = 'https://xaixkcaeufxesqmdzhuv.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhhaXhrY2FldWZ4ZXNxbWR6aHV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5Njc1NzUsImV4cCI6MjA5NDU0MzU3NX0.nrFYxWfn8kA1JV6wyiW1X6KVRxKJi6yBnMPAGVIPTjY';

// ── SUPABASE CLIENT ───────────────────────────────────────────
const supa = {
  async query(table, opts = {}) {
    let url = `${SUPA_URL}/rest/v1/${table}?`;
    if (opts.select)  url += `select=${opts.select}&`;
    if (opts.filter)  url += `${opts.filter}&`;
    if (opts.order)   url += `order=${opts.order}&`;
    if (opts.limit)   url += `limit=${opts.limit}&`;
    const res = await fetch(url, {
      headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}`, 'Content-Type': 'application/json' }
    });
    return res.json();
  },
  async insert(table, data) {
    const res = await fetch(`${SUPA_URL}/rest/v1/${table}`, {
      method: 'POST',
      headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}`, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify(Array.isArray(data) ? data : [data])
    });
    return res.ok;
  },
  async upsert(table, data) {
    const res = await fetch(`${SUPA_URL}/rest/v1/${table}`, {
      method: 'POST',
      headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}`, 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify(Array.isArray(data) ? data : [data])
    });
    return res.ok;
  },
  async update(table, filter, data) {
    const res = await fetch(`${SUPA_URL}/rest/v1/${table}?${filter}`, {
      method: 'PATCH',
      headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    return res.ok;
  }
};

// ── UTILS ─────────────────────────────────────────────────────
const fmt    = n  => 'Rp ' + Math.round(n || 0).toLocaleString('id-ID');
const toISO  = () => new Date().toISOString().slice(0, 10);
const toTime = () => { const d = new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:00`; };
const toTimeShort = () => toTime().slice(0, 5);
const getShift = () => { const h = new Date().getHours(); return h < 11 ? 'PAGI' : h < 17 ? 'SIANG' : 'MALAM'; };
const pad  = (n, l = 4) => String(n).padStart(l, '0');
const uid  = () => Math.random().toString(36).slice(2, 9).toUpperCase();
const todayLabel = () => new Date().toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long' });

// ── OFFLINE QUEUE ─────────────────────────────────────────────
const Q = {
  get:  () => JSON.parse(localStorage.getItem('posq') || '[]'),
  save: q  => localStorage.setItem('posq', JSON.stringify(q)),
  add:  item => { const q = Q.get(); q.push(item); Q.save(q); },
  flush: async (onProgress) => {
    const q = Q.get(); if (!q.length) return;
    const fail = [];
    for (const item of q) {
      try { await supa.insert(item.table, item.data); }
      catch(e) { fail.push(item); }
    }
    Q.save(fail);
    if (onProgress) onProgress(fail.length);
  }
};

// ── TOAST HOOK ────────────────────────────────────────────────
function useToast() {
  const [toast, setToast] = useState({ msg: '', type: '', show: false });
  const show = useCallback((msg, type = '') => {
    setToast({ msg, type, show: true });
    setTimeout(() => setToast(t => ({ ...t, show: false })), 2500);
  }, []);
  return [toast, show];
}

// ── CLOCK ─────────────────────────────────────────────────────
function Clock() {
  const [t, setT] = useState('');
  useEffect(() => {
    const tick = () => { const d = new Date(); setT(`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`); };
    tick(); const id = setInterval(tick, 1000); return () => clearInterval(id);
  }, []);
  return <span style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--c-text3)' }}>{t}</span>;
}

// ══════════════════════════════════════════════════════════════
//  LOGIN PAGE
// ══════════════════════════════════════════════════════════════
function LoginPage({ onLogin }) {
  const [outlets, setOutlets] = useState([]);
  const [karyawan, setKaryawan] = useState([]);
  const [outlet, setOutlet] = useState('');
  const [kasir, setKasir] = useState(null);
  const [pin, setPin] = useState('');
  const [modalAwal, setModalAwal] = useState('');
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(true);
  const [syncStatus, setSyncStatus] = useState('ld');

  useEffect(() => {
    (async () => {
      try {
        const [o, k] = await Promise.all([
          supa.query('outlets', { select: '*', filter: 'aktif=eq.true', order: 'nama' }),
          supa.query('karyawan', { select: '*', filter: 'aktif=eq.true', order: 'nama' })
        ]);
        setOutlets(o || []); setKaryawan(k || []);
        setSyncStatus('ok');
      } catch(e) { setSyncStatus('err'); setErr('Gagal terhubung ke server'); }
      finally { setLoading(false); }
    })();
  }, []);

  const filteredKasir = useMemo(() => {
    if (!outlet) return karyawan;
    return karyawan.filter(k => k.outlet_id === outlet || k.outlet_id === 'ALL');
  }, [karyawan, outlet]);

  const handlePin = (v) => {
    if (v === 'C') { setPin(''); return; }
    if (v === 'X') { setPin(p => p.slice(0, -1)); return; }
    if (pin.length >= 4) return;
    setPin(p => p + v);
  };

  const handleLogin = () => {
    if (!outlet) { setErr('Pilih outlet'); return; }
    if (!kasir)  { setErr('Pilih kasir'); return; }
    if (!pin)    { setErr('Masukkan PIN'); return; }
    if (pin !== String(kasir.pin)) { setErr('PIN salah'); setPin(''); return; }
    // Simpan modal awal ke shift data
    const modal = parseInt(modalAwal) || 0;
    const existSd = JSON.parse(localStorage.getItem('pos_shift_data') || '{}');
    const todayISO = new Date().toISOString().slice(0,10);
    // Reset shift data tiap hari baru atau outlet berbeda
    if (!existSd.tgl || existSd.tgl !== todayISO || existSd.outletId !== outlet) {
      localStorage.setItem('pos_shift_data', JSON.stringify({
        totalPenjualan:0, totalQris:0, totalTunai:0, totalPengeluaran:0,
        modal: modal, outletId: outlet, tgl: todayISO, kasirId: kasir.id
      }));
    } else {
      existSd.modal = modal;
      localStorage.setItem('pos_shift_data', JSON.stringify(existSd));
    }
    onLogin({ user: kasir, outletId: outlet, outletNama: outlets.find(o => o.id === outlet)?.nama });
  };

  const pinDisplay = pin ? '●'.repeat(pin.length) + '—'.repeat(4 - pin.length) : '— — — —';

  return (
    <div className="login-wrap">
      <div className="login-logo">
        <div className="login-logo-icon">☕</div>
        <h1>Teras Nyai</h1>
        <p><span className={`sync-dot ${syncStatus}`}></span>POS Terminal v2.0</p>
      </div>
      <div className="login-box">
        <div className="form-group">
          <label className="form-label">Pilih Outlet</label>
          <select className="form-select" value={outlet} onChange={e => { setOutlet(e.target.value); setKasir(null); }}>
            <option value="">-- Pilih Outlet --</option>
            {outlets.map(o => <option key={o.id} value={o.id}>{o.nama}</option>)}
          </select>
        </div>
        <div className="form-group">
          <label className="form-label">Pilih Kasir</label>
          <select className="form-select" value={kasir?.id || ''} onChange={e => setKasir(karyawan.find(k => k.id === e.target.value) || null)}>
            <option value="">-- Pilih Nama --</option>
            {filteredKasir.map(k => <option key={k.id} value={k.id}>{k.nama} ({k.jabatan})</option>)}
          </select>
        </div>
        <div className="form-group" style={{marginBottom:10}}>
          <label className="form-label">Modal Awal Shift (Rp)</label>
          <input
            type="number" className="form-input"
            placeholder="Contoh: 500000"
            value={modalAwal}
            onChange={e => setModalAwal(e.target.value)}
            style={{fontFamily:'var(--c-mono)',textAlign:'right'}}
            inputMode="numeric"
          />
        </div>
        <div className="pin-display">{pinDisplay}</div>
        <div className="pin-grid">
          {['1','2','3','4','5','6','7','8','9','C','0','X'].map(k => (
            <button key={k} className="pin-key" onClick={() => handlePin(k)}
              style={k==='C'||k==='X' ? {color:'var(--c-text2)',fontSize:16} : {}}>
              {k === 'X' ? '⌫' : k}
            </button>
          ))}
        </div>
        {err && <p style={{ color:'var(--c-red)', fontSize:12, textAlign:'center', marginBottom:8, fontFamily:'var(--mono)' }}>{err}</p>}
        <button className="btn btn-amber btn-lg btn-full" onClick={handleLogin} disabled={loading}>
          {loading ? 'Memuat...' : 'MASUK'}
        </button>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
//  TRANSAKSI PAGE
// ══════════════════════════════════════════════════════════════
function TrxPage({ session, toast }) {
  const [menu, setMenu]     = useState([]);
  const [kat, setKat]       = useState('Semua');
  const [cart, setCart]     = useState([]);
  const [payMethod, setPay] = useState('TUNAI');
  const [orderType, setOT]  = useState('DINE_IN');
  const [disc, setDisc]     = useState(0);
  const [ppn, setPpn]       = useState(false);
  const [note, setNote]     = useState('');
  const [struk, setStruk]   = useState(null);
  const [qLen, setQLen]     = useState(Q.get().length);
  const [submitting, setSub]= useState(false);
  const tcRef = useRef(1);

  useEffect(() => {
    supa.query('menu', { select: '*', filter: 'aktif=eq.true', order: 'kategori,nama' }).then(d => setMenu(d || []));
    // flush offline queue
    Q.flush(n => setQLen(n));
  }, []);

  const cats = useMemo(() => ['Semua', ...new Set(menu.map(m => m.kategori))], [menu]);
  const filtered = useMemo(() => kat === 'Semua' ? menu : menu.filter(m => m.kategori === kat), [menu, kat]);

  const addToCart = (m) => {
    setCart(c => {
      const ex = c.find(x => x.id === m.id);
      if (ex) return c.map(x => x.id === m.id ? { ...x, qty: x.qty + 1 } : x);
      return [...c, { id: m.id, nama: m.nama, harga: +m.harga, hpp: +m.hpp, kat: m.kategori, qty: 1 }];
    });
  };
  const chgQty = (id, d) => setCart(c => c.map(x => x.id === id ? { ...x, qty: x.qty + d } : x).filter(x => x.qty > 0));
  const clrCart = () => { setCart([]); setDisc(0); setPpn(false); setNote(''); };

  const sub     = cart.reduce((s, c) => s + c.harga * c.qty, 0);
  const hpp     = cart.reduce((s, c) => s + c.hpp * c.qty, 0);
  const disNom  = Math.round(sub * (disc / 100));
  const ppnVal  = ppn ? Math.round((sub - disNom) * 0.11) : 0;
  const total   = sub - disNom + ppnVal;

  const handlePay = async () => {
    if (!cart.length) { toast('Keranjang kosong', 'err'); return; }
    setSub(true);
    const id = `TRX-${session.outletId.replace('OTL-','')}-${toISO().replace(/-/g,'')}-${pad(tcRef.current)}`;
    tcRef.current++;
    const trx = {
      id, outlet_id: session.outletId, kasir_id: session.user.id, kasir_nama: session.user.nama,
      tgl: toISO(), jam: toTime(), shift: getShift(), tipe_order: orderType,
      subtotal: sub, diskon_pct: disc, diskon_nominal: disNom, ppn: ppnVal,
      total, hpp_total: hpp, gross_profit: total - hpp,
      metode_bayar: payMethod, catatan: note, status: 'LUNAS'
    };
    const details = cart.map((c, i) => ({
      id: `${id}-${pad(i+1,2)}`, transaksi_id: id, outlet_id: session.outletId,
      tgl: toISO(), menu_id: c.id, nama_menu: c.nama, kategori: c.kat,
      qty: c.qty, harga_jual: c.harga, hpp_satuan: c.hpp,
      subtotal: c.harga * c.qty, hpp_total: c.hpp * c.qty,
      gross_profit: (c.harga - c.hpp) * c.qty
    }));
    try {
      const ok1 = await supa.insert('transaksi', trx);
      const ok2 = await supa.insert('transaksi_detail', details);
      if (ok1 && ok2) toast('Tersimpan ✓', 'ok');
      else throw new Error();
    } catch(e) {
      Q.add({ table: 'transaksi', data: trx });
      details.forEach(d => Q.add({ table: 'transaksi_detail', data: d }));
      setQLen(Q.get().length);
      toast('Offline — masuk antrian', '');
    }
    setStruk({ ...trx, items: cart });

    // Update shift data di localStorage untuk auto-fill closing
    const existing = JSON.parse(localStorage.getItem('pos_shift_data') || '{}');
    const shiftKey = session.outletId + '_' + toISO();
    const prev = JSON.parse(localStorage.getItem('pos_shift_' + shiftKey) || '{"total":0,"qris":0,"tunai":0,"pengeluaran":0,"modal":0}');
    const updated = {
      totalPenjualan: (prev.totalPenjualan || 0) + total,
      totalQris: (prev.totalQris || 0) + (payMethod === 'QRIS' ? total : 0),
      totalTunai: (prev.totalTunai || 0) + (payMethod === 'TUNAI' ? total : 0),
      totalPengeluaran: prev.totalPengeluaran || 0,
      modal: prev.modal || 0,
      outletId: session.outletId,
      tgl: toISO()
    };
    localStorage.setItem('pos_shift_data', JSON.stringify(updated));

    clrCart(); setSub(false);
  };

  const totalQty = cart.reduce((s, c) => s + c.qty, 0);

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100%' }}>
      {qLen > 0 && (
        <div style={{ background:'var(--c-amberD)', borderBottom:'1px solid var(--c-amber)', padding:'8px 14px', fontSize:12, fontFamily:'var(--mono)', color:'var(--c-amber)' }}>
          ⏳ {qLen} transaksi menunggu sinkronisasi
        </div>
      )}

      {/* Kategori - sticky */}
      <div className="cat-pills">
        {cats.map(c => <div key={c} className={`cat-pill ${kat===c?'active':''}`} onClick={() => setKat(c)}>{c}</div>)}
      </div>

      {/* Scrollable content */}
      <div style={{ flex:1, overflowY:'auto', WebkitOverflowScrolling:'touch' }}>
      <div className="menu-grid">
        {filtered.map(m => (
          <div key={m.id} className="menu-card" onClick={() => addToCart(m)}>
            <div className="menu-card-cat">{m.kategori}</div>
            <div className="menu-card-name">{m.nama}</div>
            <div className="menu-card-price">{fmt(m.harga)}</div>
            <div className="menu-card-hpp">HPP {fmt(m.hpp)}</div>
          </div>
        ))}
      </div>

      {/* Cart */}
      {cart.length > 0 && (
        <div className="card" style={{ flexShrink:0 }}>
          <div className="card-head">
            <span className="card-title">Keranjang</span>
            <div style={{ display:'flex', gap:8, alignItems:'center' }}>
              <span className="badge badge-amber">{totalQty} item</span>
              <button className="btn btn-xs btn-danger" onClick={clrCart}>Hapus</button>
            </div>
          </div>
          {cart.map(c => (
            <div key={c.id} className="cart-item">
              <div className="cart-item-info">
                <div className="cart-item-name">{c.nama}</div>
                <div className="cart-item-sub">HPP {fmt(c.hpp)}/pcs · margin {Math.round((c.harga-c.hpp)/c.harga*100)}%</div>
              </div>
              <div className="qty-ctrl">
                <button className="qty-btn" onClick={() => chgQty(c.id,-1)}>−</button>
                <span className="qty-val">{c.qty}</span>
                <button className="qty-btn" onClick={() => chgQty(c.id,1)}>+</button>
              </div>
              <div className="cart-price">{fmt(c.harga*c.qty)}</div>
            </div>
          ))}
        </div>
      )}

      {/* Total & Pay */}
      <div style={{ overflowY:'auto', flexShrink:0 }}>
        <div className="total-box">
          <div className="total-row"><span className="l">Subtotal</span><span style={{fontFamily:'var(--mono)'}}>{fmt(sub)}</span></div>
          <div className="total-row">
            <span className="l">Diskon</span>
            <div style={{ display:'flex', alignItems:'center', gap:6 }}>
              <input className="disc-input" type="number" value={disc} min={0} max={100} onChange={e => setDisc(+e.target.value)} />
              <span style={{ fontSize:12, color:'var(--c-text2)', fontFamily:'var(--mono)' }}>%</span>
            </div>
          </div>
          <div className="total-row">
            <span className="l">PPN 11%</span>
            <label style={{ display:'flex', alignItems:'center', gap:6, cursor:'pointer' }}>
              <input type="checkbox" checked={ppn} onChange={e => setPpn(e.target.checked)} style={{ accentColor:'var(--c-amber)' }} />
              <span style={{ fontFamily:'var(--mono)' }}>{fmt(ppnVal)}</span>
            </label>
          </div>
          <div className="total-row total-grand"><span>TOTAL</span><span>{fmt(total)}</span></div>
        </div>

        <div style={{ padding:'0 12px 10px' }}>
          <div className="section-title" style={{ padding:'0 0 8px' }}>Metode Bayar</div>
          <div className="pay-grid">
            {[['TUNAI','💵'],['QRIS','📱'],['TRANSFER','🏦'],['KARTU','💳']].map(([m,ic]) => (
              <div key={m} className={`pay-btn ${payMethod===m?'active':''}`} onClick={() => setPay(m)}>
                <span className="pay-icon">{ic}</span>{m}
              </div>
            ))}
          </div>
          <div className="section-title" style={{ padding:'0 0 8px' }}>Tipe Order</div>
          <div className="order-types" style={{ marginBottom:12 }}>
            {[['DINE_IN','Dine In'],['TAKE_AWAY','Take Away'],['DELIVERY','Delivery'],['ONLINE','Online']].map(([v,l]) => (
              <div key={v} className={`order-type ${orderType===v?'active':''}`} onClick={() => setOT(v)}>{l}</div>
            ))}
          </div>
          <input className="form-input" type="text" placeholder="Catatan (opsional)" value={note} onChange={e => setNote(e.target.value)} style={{ marginBottom:10 }} />
          <button className="btn btn-amber btn-lg btn-full" onClick={handlePay} disabled={submitting || !cart.length}>
            {submitting ? '⏳ Memproses...' : `Bayar ${fmt(total)}`}
          </button>
        </div>
      </div>

      </div>{/* end scrollable */}

      {/* Modal Struk */}
      {struk && (
        <div className="modal-bg" onClick={() => setStruk(null)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-handle"></div>
            <div style={{ textAlign:'center', marginBottom:14 }}>
              <div style={{ fontSize:15, fontWeight:700, color:'var(--c-amber)' }}>{session.outletNama}</div>
              <div style={{ fontSize:11, color:'var(--c-text2)', fontFamily:'var(--mono)' }}>{struk.id}</div>
              <div style={{ fontSize:11, color:'var(--c-text2)', fontFamily:'var(--mono)' }}>{struk.tgl} {struk.jam?.slice(0,5)} · {struk.kasir_nama}</div>
            </div>
            <div className="struk-divider"></div>
            <div className="struk">
              {struk.items.map(i => (
                <div key={i.id} className="struk-row">
                  <span style={{ color:'var(--c-text2)' }}>{i.nama} ×{i.qty}</span>
                  <span>{fmt(i.harga * i.qty)}</span>
                </div>
              ))}
              <div className="struk-divider"></div>
              <div className="struk-row"><span style={{ color:'var(--c-text2)' }}>Subtotal</span><span>{fmt(struk.subtotal)}</span></div>
              {struk.diskon_nominal > 0 && <div className="struk-row"><span style={{ color:'var(--c-text2)' }}>Diskon {struk.diskon_pct}%</span><span>−{fmt(struk.diskon_nominal)}</span></div>}
              {struk.ppn > 0 && <div className="struk-row"><span style={{ color:'var(--c-text2)' }}>PPN 11%</span><span>{fmt(struk.ppn)}</span></div>}
              <div className="struk-divider"></div>
              <div className="struk-row" style={{ fontSize:16, fontWeight:700, color:'var(--c-amber)' }}><span>TOTAL</span><span>{fmt(struk.total)}</span></div>
              <div className="struk-divider"></div>
              <div className="struk-row"><span style={{ color:'var(--c-text2)' }}>Bayar</span><span>{struk.metode_bayar}</span></div>
              <div className="struk-row"><span style={{ color:'var(--c-text2)' }}>Tipe</span><span>{struk.tipe_order?.replace('_',' ')}</span></div>
            </div>
            <div style={{ height:14 }}></div>
            <button className="btn btn-amber btn-lg btn-full" onClick={() => setStruk(null)}>Transaksi Baru</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
//  ABSENSI PAGE
// ══════════════════════════════════════════════════════════════
function AbsenPage({ session, toast }) {
  const [absen, setAbsen]   = useState([]);
  const [karyawan, setKar]  = useState([]);
  const [shift, setShift]   = useState('SIANG');
  const [ket, setKet]       = useState('');

  useEffect(() => {
    const tgl = toISO();
    supa.query('absensi', { select: '*', filter: `tgl=eq.${tgl}&outlet_id=eq.${session.outletId}` }).then(d => setAbsen(d || []));
    supa.query('karyawan', { select: '*', filter: `outlet_id=eq.${session.outletId},aktif=eq.true` }).then(d => setKar(d || []));
  }, []);

  const getAbsen = (empId, tipe) => absen.find(a => a.emp_id === empId && a.tipe === tipe);

  const doAbsen = async (tipe) => {
    const exist = getAbsen(session.user.id, tipe);
    if (exist) { toast(`Sudah absen ${tipe}`, 'err'); return; }
    const d = {
      id: `ABS-${session.outletId}-${toISO().replace(/-/g,'')}-${session.user.id}-${tipe}`,
      outlet_id: session.outletId, emp_id: session.user.id, emp_nama: session.user.nama,
      tgl: toISO(), jam: toTime(), tipe, shift, ket
    };
    const ok = await supa.insert('absensi', d);
    if (ok) { setAbsen(a => [...a, d]); toast(`Absen ${tipe} — ${toTimeShort()} ✓`, 'ok'); }
    else { Q.add({ table:'absensi', data:d }); setAbsen(a => [...a, d]); toast('Disimpan lokal', ''); }
  };

  const myMasuk  = getAbsen(session.user.id, 'MASUK');
  const myPulang = getAbsen(session.user.id, 'PULANG');

  return (
    <div className="page">
      <div className="page-header" style={{ marginBottom:4 }}>
        <div><div className="page-title">Absensi</div><div className="page-sub">{todayLabel()}</div></div>
        <span className="badge badge-blue">{session.outletNama}</span>
      </div>

      <div className="absen-cards">
        <div className={`absen-card masuk ${myMasuk?'done':''}`} onClick={() => doAbsen('MASUK')}>
          <div className="absen-icon">✅</div>
          <div className="absen-time" style={{ color: myMasuk?'var(--c-green)':'var(--c-text)' }}>{myMasuk ? myMasuk.jam?.slice(0,5) : '--:--'}</div>
          <div className="absen-label">MASUK</div>
        </div>
        <div className={`absen-card pulang ${myPulang?'done':''}`} onClick={() => doAbsen('PULANG')}>
          <div className="absen-icon">🚪</div>
          <div className="absen-time" style={{ color: myPulang?'var(--c-red)':'var(--c-text)' }}>{myPulang ? myPulang.jam?.slice(0,5) : '--:--'}</div>
          <div className="absen-label">PULANG</div>
        </div>
      </div>

      <div style={{ padding:'0 12px', marginBottom:12 }}>
        <div className="form-group">
          <label className="form-label">Shift</label>
          <select className="form-select" value={shift} onChange={e => setShift(e.target.value)}>
            <option value="PAGI">Pagi (07:00–15:00)</option>
            <option value="SIANG">Siang (11:00–19:00)</option>
            <option value="MALAM">Malam (15:00–23:00)</option>
          </select>
        </div>
        <div className="form-group">
          <label className="form-label">Keterangan</label>
          <input className="form-input" type="text" placeholder="Izin terlambat, dll..." value={ket} onChange={e => setKet(e.target.value)} />
        </div>
      </div>

      <div className="card">
        <div className="card-head"><span className="card-title">Tim Hari Ini</span></div>
        {karyawan.length === 0 && <div className="empty"><div className="empty-icon">👥</div><div className="empty-text">Tidak ada data</div></div>}
        {karyawan.map(k => {
          const m = getAbsen(k.id, 'MASUK');
          const p = getAbsen(k.id, 'PULANG');
          return (
            <div key={k.id} className="list-item">
              <div className="list-item-left">
                <div className="title">{k.nama}</div>
                <div className="sub">{k.jabatan} · {k.id}</div>
              </div>
              <div style={{ display:'flex', gap:5 }}>
                <span className={`badge ${m?'badge-green':'badge-red'}`}>{m ? m.jam?.slice(0,5) : 'Belum'}</span>
                <span className={`badge ${p?'badge-blue':'badge-amber'}`}>{p ? p.jam?.slice(0,5) : '–'}</span>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
//  PENGELUARAN PAGE
// ══════════════════════════════════════════════════════════════
function KeuPage({ session, toast }) {
  const [items, setItems] = useState([]);
  const [form, setForm]   = useState({ tgl: toISO(), akun:'', nominal:'', ket:'', metode:'KAS', bukti:'' });
  const [saving, setSaving] = useState(false);
  const kc = useRef(1);

  useEffect(() => {
    supa.query('pengeluaran', { select:'*', filter:`tgl=eq.${toISO()}&outlet_id=eq.${session.outletId}`, order:'created_at.desc' }).then(d => setItems(d||[]));
  }, []);

  const totalToday = items.reduce((s,p) => s + p.nominal, 0);

  const handleSave = async () => {
    if (!form.akun)    { toast('Pilih akun', 'err'); return; }
    if (!form.nominal) { toast('Isi nominal', 'err'); return; }
    if (!form.ket)     { toast('Isi keterangan', 'err'); return; }
    setSaving(true);
    const pt = form.akun.split('|');
    const id = `EXP-${session.outletId.replace('OTL-','')}-${toISO().replace(/-/g,'')}-${pad(kc.current,3)}`;
    kc.current++;
    const d = {
      id, outlet_id: session.outletId, tgl: form.tgl,
      kode_akun: pt[0], nama_akun: pt[1], nominal: +form.nominal,
      ket: form.ket, metode_bayar: form.metode, bukti_url: form.bukti || null,
      diinput_oleh: session.user.id, diinput_nama: session.user.nama, status:'PENDING'
    };
    const ok = await supa.insert('pengeluaran', d);
    if (ok) toast('Pengeluaran tersimpan ✓', 'ok');
    else { Q.add({ table:'pengeluaran', data:d }); toast('Disimpan lokal', ''); }
    // Update pengeluaran di shift data untuk auto-fill closing
    const sdKeu = JSON.parse(localStorage.getItem('pos_shift_data') || '{}');
    sdKeu.totalPengeluaran = (sdKeu.totalPengeluaran || 0) + (+form.nominal || 0);
    localStorage.setItem('pos_shift_data', JSON.stringify(sdKeu));
    setItems(i => [d, ...i]);
    setForm({ tgl:toISO(), akun:'', nominal:'', ket:'', metode:'KAS', bukti:'' });
    setSaving(false);
  };

  return (
    <div className="page">
      <div className="page-header">
        <div><div className="page-title">Pengeluaran</div><div className="page-sub">Total hari ini: {fmt(totalToday)}</div></div>
      </div>

      <div style={{ padding:12 }}>
        <div className="form-group">
          <label className="form-label">Tanggal</label>
          <input className="form-input" type="date" value={form.tgl} onChange={e => setForm(f=>({...f,tgl:e.target.value}))} />
        </div>
        <div className="form-group">
          <label className="form-label">Kategori Akun</label>
          <select className="form-select" value={form.akun} onChange={e => setForm(f=>({...f,akun:e.target.value}))}>
            <option value="">-- Pilih Akun --</option>
            <optgroup label="HPP">
              <option value="5100|Bahan Baku">5100 — Bahan Baku</option>
              <option value="5200|Packaging">5200 — Packaging</option>
            </optgroup>
            <optgroup label="Biaya Operasional">
              <option value="6100|Gaji dan Upah">6100 — Gaji &amp; Upah</option>
              <option value="6200|Sewa Tempat">6200 — Sewa Tempat</option>
              <option value="6300|Listrik dan Air">6300 — Listrik &amp; Air</option>
              <option value="6400|Gas">6400 — Gas</option>
              <option value="6500|Marketing">6500 — Marketing</option>
              <option value="6600|Transportasi">6600 — Transportasi</option>
              <option value="6700|Perlengkapan">6700 — Perlengkapan</option>
              <option value="6800|Perbaikan">6800 — Perbaikan</option>
              <option value="6900|Lain-lain">6900 — Lain-lain</option>
            </optgroup>
          </select>
        </div>
        <div className="form-group">
          <label className="form-label">Nominal (Rp)</label>
          <input className="form-input" type="number" placeholder="0" value={form.nominal} onChange={e => setForm(f=>({...f,nominal:e.target.value}))} />
        </div>
        <div className="form-group">
          <label className="form-label">Keterangan / Vendor</label>
          <input className="form-input" type="text" placeholder="Beli ayam 5kg..." value={form.ket} onChange={e => setForm(f=>({...f,ket:e.target.value}))} />
        </div>
        <div className="form-group">
          <label className="form-label">Metode</label>
          <select className="form-select" value={form.metode} onChange={e => setForm(f=>({...f,metode:e.target.value}))}>
            <option value="KAS">Kas Outlet</option>
            <option value="TRANSFER">Transfer</option>
            <option value="KARTU_KREDIT">Kartu Kredit</option>
          </select>
        </div>
        <button className="btn btn-amber btn-lg btn-full" onClick={handleSave} disabled={saving}>
          {saving ? 'Menyimpan...' : 'Simpan Pengeluaran'}
        </button>
      </div>

      <div className="card">
        <div className="card-head">
          <span className="card-title">Hari Ini</span>
          <span className="badge badge-red">{fmt(totalToday)}</span>
        </div>
        {items.length === 0 && <div className="empty"><div className="empty-icon">📋</div><div className="empty-text">Belum ada pengeluaran</div></div>}
        {items.map(p => (
          <div key={p.id} className="list-item">
            <div className="list-item-left">
              <div className="title">{p.nama_akun}</div>
              <div className="sub">{p.kode_akun} · {p.ket}</div>
            </div>
            <div style={{ textAlign:'right' }}>
              <div style={{ fontFamily:'var(--mono)', fontSize:14, color:'var(--c-red)', fontWeight:600 }}>{fmt(p.nominal)}</div>
              <div style={{ fontSize:11, color:'var(--c-text2)', fontFamily:'var(--mono)' }}>{p.metode_bayar}</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
//  LAPORAN PAGE
// ══════════════════════════════════════════════════════════════
function LapPage({ session, toast }) {
  const [trx, setTrx]       = useState([]);
  const [keluar, setKeluar] = useState([]);
  const [loading, setLoad]  = useState(true);

  useEffect(() => {
    const tgl = toISO();
    Promise.all([
      supa.query('transaksi', { select:'*', filter:`tgl=eq.${tgl}&outlet_id=eq.${session.outletId}&status=eq.LUNAS`, order:'created_at.desc' }),
      supa.query('pengeluaran', { select:'*', filter:`tgl=eq.${tgl}&outlet_id=eq.${session.outletId}` })
    ]).then(([t,k]) => { setTrx(t||[]); setKeluar(k||[]); setLoad(false); });
  }, []);

  const totalP  = trx.reduce((s,t) => s + t.total, 0);
  const totalH  = trx.reduce((s,t) => s + t.hpp_total, 0);
  const grossP  = trx.reduce((s,t) => s + t.gross_profit, 0);
  const totalK  = keluar.reduce((s,k) => s + k.nominal, 0);
  const net     = grossP - totalK;

  const byMetode = ['TUNAI','QRIS','TRANSFER','KARTU'].map(m => ({
    m, v: trx.filter(t=>t.metode_bayar===m).reduce((s,t)=>s+t.total,0)
  }));

  const menuCount = {};
  trx.forEach(t => {}); // menu count from detail not loaded here for simplicity

  const handleTutup = async () => {
    const id = `SHF-${session.outletId.replace('OTL-','')}-${toISO().replace(/-/g,'')}-${session.user.id}`;
    const d = {
      id, outlet_id: session.outletId, kasir_id: session.user.id, kasir_nama: session.user.nama,
      tgl: toISO(), shift: getShift(),
      total_penjualan: totalP, total_trx: trx.length, total_hpp: totalH,
      gross_profit: grossP, total_pengeluaran: totalK, net_shift: net,
      jam_tutup: toTime()
    };
    const ok = await supa.insert('shift_log', d);
    toast(ok ? 'Shift ditutup & tersimpan ✓' : 'Gagal', ok ? 'ok' : 'err');
  };

  if (loading) return <div className="empty"><div className="empty-icon">⏳</div><div className="empty-text">Memuat laporan...</div></div>;

  return (
    <div className="page">
      <div className="page-header">
        <div><div className="page-title">Laporan Shift</div><div className="page-sub">{todayLabel()} · {session.user.nama}</div></div>
      </div>

      <div className="stats-grid">
        <div className="stat-card">
          <div className="stat-label">Total Penjualan</div>
          <div className="stat-value" style={{ color:'var(--c-amber)' }}>{fmt(totalP)}</div>
          <div className="stat-sub">{trx.length} transaksi</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">Gross Profit</div>
          <div className="stat-value" style={{ color:'var(--c-green)' }}>{fmt(grossP)}</div>
          <div className="stat-sub">HPP {fmt(totalH)}</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">Pengeluaran</div>
          <div className="stat-value" style={{ color:'var(--c-red)' }}>{fmt(totalK)}</div>
          <div className="stat-sub">{keluar.length} item</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">Net Shift</div>
          <div className="stat-value" style={{ color: net>=0?'var(--c-green)':'var(--c-red)' }}>{fmt(net)}</div>
          <div className="stat-sub">{net>=0?'Untung':'Rugi'}</div>
        </div>
      </div>

      <div className="card">
        <div className="card-head"><span className="card-title">Rekap Metode Bayar</span></div>
        <div className="card-body" style={{ paddingTop:8, paddingBottom:8 }}>
          {byMetode.map(({ m, v }) => (
            <div key={m} style={{ display:'flex', justifyContent:'space-between', padding:'5px 0', fontFamily:'var(--mono)', fontSize:13 }}>
              <span style={{ color:'var(--c-text2)' }}>{m}</span><span>{fmt(v)}</span>
            </div>
          ))}
        </div>
      </div>

      <div className="card">
        <div className="card-head">
          <span className="card-title">Riwayat Transaksi</span>
          <span className="badge badge-amber">{trx.length}</span>
        </div>
        {trx.length === 0 && <div className="empty" style={{ padding:'24px 0' }}><div className="empty-icon">🧾</div><div className="empty-text">Belum ada transaksi</div></div>}
        {trx.map(t => (
          <div key={t.id} className="list-item">
            <div className="list-item-left">
              <div className="title" style={{ fontFamily:'var(--mono)', fontSize:11 }}>{t.id}</div>
              <div className="sub">{t.tipe_order?.replace('_',' ')} · {t.jam?.slice(0,5)}</div>
            </div>
            <div style={{ textAlign:'right' }}>
              <div style={{ fontFamily:'var(--mono)', fontSize:14, fontWeight:600, color:'var(--c-amber)' }}>{fmt(t.total)}</div>
              <div style={{ fontSize:11, color:'var(--c-text2)', fontFamily:'var(--mono)' }}>{t.metode_bayar}</div>
            </div>
          </div>
        ))}
      </div>

      <div style={{ padding:'0 12px 20px' }}>
        <button className="btn btn-success btn-lg btn-full" onClick={handleTutup}>
          Tutup Shift &amp; Simpan ke Database
        </button>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
//  CLOSING REDIRECT
// ══════════════════════════════════════════════════════════════
function ClosingRedirect({ session }) {
  // Simpan session ke localStorage agar closing.html bisa baca
  React.useEffect(() => {
    localStorage.setItem('pos_session', JSON.stringify(session));
    // Inisialisasi shift data jika belum ada
    const sd = JSON.parse(localStorage.getItem('pos_shift_data') || '{}');
    if (!sd.tgl || sd.tgl !== new Date().toISOString().slice(0,10)) {
      localStorage.setItem('pos_shift_data', JSON.stringify({
        totalPenjualan: 0, totalQris: 0, totalTunai: 0,
        totalPengeluaran: 0, modal: 0,
        outletId: session.outletId, tgl: new Date().toISOString().slice(0,10)
      }));
    }
  }, []);

  const handleOpen = () => {
    localStorage.setItem('pos_session', JSON.stringify(session));
    window.location.href = 'closing.html';
  };

  return (
    <div style={{ padding:24, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', minHeight:'60dvh', textAlign:'center' }}>
      <div style={{ fontSize:56, marginBottom:16 }}>🔒</div>
      <div style={{ fontSize:20, fontWeight:700, marginBottom:8 }}>Tutup Shift</div>
      <div style={{ fontSize:13, color:'var(--c-text2)', lineHeight:1.7, marginBottom:24, maxWidth:280 }}>
        Isi semua laporan closing dalam satu langkah:<br/>
        SOP · Report Sales · Stock Bahan · Stock Kemasan
      </div>
      <div style={{ width:'100%', maxWidth:300, display:'flex', flexDirection:'column', gap:10 }}>
        <button className="btn btn-success btn-lg btn-full" onClick={handleOpen}>
          Buka Form Tutup Shift →
        </button>
        <div style={{ fontSize:11, color:'var(--c-text3)', fontFamily:'var(--c-mono)', marginTop:4 }}>
          {session.user.nama} · {session.outletNama}
        </div>
      </div>

      <div style={{ marginTop:32, background:'var(--c-bg2)', border:'1px solid var(--c-border)', borderRadius:12, padding:16, width:'100%', maxWidth:320, textAlign:'left' }}>
        <div style={{ fontSize:11, fontWeight:700, color:'var(--c-amber)', fontFamily:"'JetBrains Mono',monospace", textTransform:'uppercase', letterSpacing:'.06em', marginBottom:12 }}>Yang akan diisi</div>
        {[
          ['🔒', 'SOP Closing', '15 item checklist + kebersihan'],
          ['💰', 'Report Sales', 'Modal, omset, marketplace, kas'],
          ['📦', 'Stock Bahan', '33 item bahan per kategori'],
          ['🧴', 'Stock Kemasan', '16 item kemasan'],
        ].map(function(item) {
          return (
            <div key={item[0]} style={{ display:'flex', alignItems:'center', gap:10, padding:'8px 0', borderBottom:'1px solid var(--c-border)' }}>
              <span style={{ fontSize:20 }}>{item[0]}</span>
              <div>
                <div style={{ fontSize:13, fontWeight:500 }}>{item[1]}</div>
                <div style={{ fontSize:11, color:'var(--c-text2)' }}>{item[2]}</div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
//  MAIN APP
// ══════════════════════════════════════════════════════════════
function App() {
  const [session, setSession] = useState(null);
  const [tab, setTab]         = useState('trx');
  const [toast, showToast]    = useToast();

  const handleLogin  = (s) => setSession(s);
  const handleLogout = () => { setSession(null); setTab('trx'); };

  if (!session) return <LoginPage onLogin={handleLogin} />;

  const tabs = [
    { id:'trx',  icon:'fa-solid fa-receipt',       label:'Transaksi' },
    { id:'abs',  icon:'fa-solid fa-user-check',    label:'Absensi'   },
    { id:'keu',  icon:'fa-solid fa-money-bill-wave', label:'Keluar'  },
    { id:'lap',  icon:'fa-solid fa-chart-line',    label:'Laporan'   },
    { id:'cls',  icon:'fa-solid fa-door-closed',   label:'Tutup'     },
  ];

  return (
    <div className="app">
      {/* Topbar */}
      <div className="topbar">
        <div>
          <div className="topbar-brand">☕ Teras Nyai</div>
          <div style={{ fontSize:11, color:'var(--c-text3)', fontFamily:'var(--mono)' }}>{session.outletNama}</div>
        </div>
        <div className="topbar-info">
          <strong>{session.user.nama}</strong>
          <Clock />
        </div>
        <button className="logout-btn" onClick={handleLogout}>KELUAR</button>
      </div>

      {/* Content */}
      <div className="scroll">
        {tab === 'trx' && <TrxPage session={session} toast={showToast} />}
        {tab === 'abs' && <AbsenPage session={session} toast={showToast} />}
        {tab === 'keu' && <KeuPage session={session} toast={showToast} />}
        {tab === 'lap' && <LapPage session={session} toast={showToast} />}
      {tab === 'cls' && <ClosingRedirect session={session} />}
      </div>

      {/* Navbar */}
      <div className="navbar">
        {tabs.map(t => (
          <button key={t.id} className={`nav-btn ${tab===t.id?'active':''}`} onClick={() => setTab(t.id)}>
            <i className={t.icon}></i>
            {t.label}
          </button>
        ))}
      </div>

      {/* Toast */}
      <div className={`toast ${toast.show?'show':''} ${toast.type}`}>{toast.msg}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
