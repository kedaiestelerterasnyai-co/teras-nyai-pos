<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Tutup Shift — Teras Nyai</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--bg1:#111;--bg2:#1a1a1a;--bg3:#222;--b:#2a2a2a;--b2:#333;--tx:#f0ece4;--tx2:#888;--tx3:#555;--am:#f59e0b;--am2:#d97706;--amd:rgba(245,158,11,.12);--gn:#10b981;--gnd:rgba(16,185,129,.12);--rd:#ef4444;--rdd:rgba(239,68,68,.12);--r:12px;--rsm:8px;--font:'Plus Jakarta Sans',sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:var(--font);min-height:100dvh}
button{cursor:pointer;font-family:var(--font);touch-action:manipulation}
input,select,textarea{font-family:var(--font)}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.topbar{background:var(--bg1);border-bottom:1px solid var(--b);padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;flex-shrink:0}
.topbar-back{background:none;border:none;color:var(--tx2);font-size:20px;padding:4px;border-radius:6px}
.topbar-back:active{color:var(--am)}
.topbar-title{font-size:14px;font-weight:700;flex:1}
.topbar-sub{font-size:11px;color:var(--tx2);font-family:var(--mono)}
.steps{display:flex;overflow-x:auto;gap:0;background:var(--bg1);border-bottom:1px solid var(--b);flex-shrink:0;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step-tab{flex-shrink:0;padding:10px 14px;font-size:11px;font-weight:600;font-family:var(--mono);color:var(--tx3);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;transition:all .15s;display:flex;align-items:center;gap:5px}
.step-tab.active{color:var(--am);border-bottom-color:var(--am)}
.step-tab.done{color:var(--gn)}
.step-dot{width:7px;height:7px;border-radius:50%;background:var(--b2);flex-shrink:0}
.step-tab.active .step-dot{background:var(--am)}
.step-tab.done .step-dot{background:var(--gn)}
.content{flex:1;overflow-y:auto;padding:14px;padding-bottom:90px;-webkit-overflow-scrolling:touch}
.sec{font-size:10px;font-weight:700;color:var(--am);text-transform:uppercase;letter-spacing:.08em;font-family:var(--mono);padding:14px 0 8px;border-bottom:1px solid var(--b);margin-bottom:12px}
.sec:first-child{padding-top:0}
.card{background:var(--bg2);border:1px solid var(--b);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.card-head{padding:11px 13px;border-bottom:1px solid var(--b);font-size:11px;font-weight:700;color:var(--am);letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono)}
.card-body{padding:13px}
.fg{margin-bottom:13px}
.fg:last-child{margin-bottom:0}
.fl{font-size:11px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono);margin-bottom:5px;display:block}
.fi,.fs,.ft{width:100%;background:var(--bg3);border:1.5px solid var(--b2);border-radius:var(--rsm);color:var(--tx);font-family:var(--font);font-size:14px;padding:10px 12px;outline:none;transition:border-color .2s;-webkit-appearance:none}
.fi:focus,.fs:focus,.ft:focus{border-color:var(--am)}
.ft{resize:vertical;min-height:72px}
.fi[type=number]{font-family:var(--mono)}
.fi[readonly]{opacity:.7;background:var(--bg3);border-color:var(--b2)}
.fi-auto{background:rgba(16,185,129,.06);border-color:rgba(16,185,129,.3);color:var(--gn)}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fs option{background:var(--bg3)}
/* UPLOAD FOTO */
.upload-box{border:2px dashed var(--b2);border-radius:var(--rsm);padding:16px;text-align:center;cursor:pointer;transition:all .15s;background:var(--bg3);position:relative}
.upload-box:active,.upload-box.has-file{border-color:var(--gn);background:var(--gnd)}
.upload-box input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload-icon{font-size:24px;margin-bottom:6px}
.upload-label{font-size:12px;color:var(--tx2);font-family:var(--mono)}
.upload-name{font-size:12px;color:var(--gn);font-family:var(--mono);margin-top:4px;word-break:break-all}
/* STOCK */
.stock-row{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--b)}
.stock-row:last-child{border-bottom:none}
.stock-name{flex:1;font-size:13px;font-weight:500}
.stock-unit{font-size:11px;color:var(--tx3);font-family:var(--mono);margin-top:2px}
.stock-inp{width:80px;background:var(--bg3);border:1.5px solid var(--b2);border-radius:var(--rsm);color:var(--tx);font-family:var(--mono);font-size:14px;padding:7px 10px;text-align:center;outline:none;transition:border-color .2s;flex-shrink:0}
.stock-inp:focus{border-color:var(--am)}
/* CHECKLIST */
.chk{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:1px solid var(--b);cursor:pointer;transition:background .1s;user-select:none}
.chk:last-child{border-bottom:none}
.chk:active{background:var(--bg3)}
.chk-box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--b2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;background:var(--bg3)}
.chk-box.on{background:var(--gnd);border-color:var(--gn)}
.chk-lbl{font-size:13px;line-height:1.4;transition:color .15s}
.chk-lbl.on{color:var(--tx2)}
/* SUMMARY */
.sumbox{background:var(--bg3);border:1.5px solid var(--b2);border-radius:var(--r);padding:13px;margin-bottom:10px}
.sumrow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px}
.sumrow .l{color:var(--tx2)}
.sumrow .v{font-family:var(--mono);font-weight:600}
.sumgrand{border-top:1.5px solid var(--b2);margin-top:8px;padding-top:10px;font-size:16px;font-weight:700;color:var(--am)}
/* REKAP */
.rg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.rb{background:var(--bg3);border:1.5px solid var(--b2);border-radius:var(--rsm);padding:11px 12px}
.rl{font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono);margin-bottom:5px}
.rv{font-family:var(--mono);font-size:16px;font-weight:700}
/* PROGRESS */
.prog{background:var(--b);border-radius:4px;height:4px;margin-bottom:14px;overflow:hidden}
.prog-bar{height:100%;background:var(--am);border-radius:4px;transition:width .3s}
/* BADGE */
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;font-family:var(--mono)}
.bam{background:var(--amd);color:var(--am)}.bgn{background:var(--gnd);color:var(--gn)}.brd{background:var(--rdd);color:var(--rd)}
/* BTN */
.btn{border:none;border-radius:var(--rsm);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;cursor:pointer;touch-action:manipulation}
.btn-sm{padding:8px 14px;font-size:12px}
.btn-lg{padding:14px 18px;font-size:15px;font-weight:700}
.btn-full{width:100%}
.btn-am{background:var(--am);color:#000}.btn-am:active{background:var(--am2)}
.btn-gh{background:var(--bg3);border:1.5px solid var(--b2);color:var(--tx2)}.btn-gh:active{border-color:var(--am);color:var(--am)}
.btn-sc{background:var(--gnd);border:1.5px solid var(--gn);color:var(--gn)}
.btn-rd{background:var(--rdd);border:1.5px solid var(--rd);color:var(--rd)}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* BOTTOM */
.bot{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg1);border-top:1px solid var(--b);padding:11px 14px;display:flex;gap:10px;z-index:40}
/* TOAST */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--bg3);border:1.5px solid var(--b2);border-radius:var(--rsm);padding:10px 16px;font-size:13px;font-family:var(--mono);opacity:0;transition:all .25s;z-index:100;white-space:nowrap;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:var(--gn);color:var(--gn)}
#toast.err{border-color:var(--rd);color:var(--rd)}
/* SUCCESS */
.success{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70dvh;text-align:center;padding:24px}
.success-icon{font-size:56px;margin-bottom:16px}
.success-title{font-size:20px;font-weight:700;margin-bottom:8px;color:var(--gn)}
.success-sub{font-size:13px;color:var(--tx2);line-height:1.6}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="topbar-back" onclick="history.back()">←</button>
    <div style="flex:1">
      <div class="topbar-title">Tutup Shift</div>
      <div class="topbar-sub" id="tb-info">Loading...</div>
    </div>
    <span class="badge bam" id="tb-step">1/5</span>
  </div>
  <div class="steps">
    <button class="step-tab active" data-s="0" onclick="goStep(0)"><span class="step-dot"></span>SOP</button>
    <button class="step-tab" data-s="1" onclick="goStep(1)"><span class="step-dot"></span>Sales</button>
    <button class="step-tab" data-s="2" onclick="goStep(2)"><span class="step-dot"></span>Bahan</button>
    <button class="step-tab" data-s="3" onclick="goStep(3)"><span class="step-dot"></span>Kemasan</button>
    <button class="step-tab" data-s="4" onclick="goStep(4)"><span class="step-dot"></span>Ringkasan</button>
  </div>
  <div class="content" id="mc"></div>
  <div class="bot">
    <button class="btn btn-gh btn-sm" id="btn-prev" onclick="prevStep()" style="display:none">← Kembali</button>
    <button class="btn btn-am btn-lg btn-full" id="btn-next" onclick="nextStep()">Lanjut →</button>
  </div>
</div>
<div id="toast"></div>

<script>
var SUPA_URL = 'https://xaixkcaeufxesqmdzhuv.supabase.co';
var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhhaXhrY2FldWZ4ZXNxbWR6aHV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5Njc1NzUsImV4cCI6MjA5NDU0MzU3NX0.nrFYxWfn8kA1JV6wyiW1X6KVRxKJi6yBnMPAGVIPTjY';

// ── SESSION & SHIFT DATA ──────────────────────────────────────
var session = JSON.parse(localStorage.getItem('pos_session') || 'null') ||
  { user:{id:'EMP-001',nama:'Kasir',jabatan:'Kasir'}, outletId:'OTL-A', outletNama:'Kedai Mencong' };

// Auto-fill dari data shift POS yang tersimpan di localStorage
var shiftData = JSON.parse(localStorage.getItem('pos_shift_data') || '{}');
var autoModal       = shiftData.modal || 0;
var autoOmset       = shiftData.totalPenjualan || 0;
var autoQris        = shiftData.totalQris || 0;
var autoPengeluaran = shiftData.totalPengeluaran || 0;

var step = 0;
var fotoFiles = {}; // simpan file object untuk upload

var D = {
  sop: { cek:{}, kebersihan:{}, berita:'' },
  sales: {
    modal: autoModal, pengeluaran: autoPengeluaran,
    omset: autoOmset, qris: autoQris,
    shopee:'', gofood:'', grabfood:'', qpon:'', fisik:'', berita:''
  },
  bahan: {},
  kemasan: {}
};

// ── DATA ──────────────────────────────────────────────────────
var CEK = [
  'Rolling Door tertutup dengan Benar dan digembok',
  'Nyalakan Listrik Malam','Freezer Menyala','Showcase Menyala',
  'Mesin Cup Sealer Off','Mesin Kasir Off','Laporan Sales',
  'Stockan Bahan','Stockan Kemasan',
  'Cek Kondisi Gas dan Kompor Mati dan Copot dari selangnya',
  'Cek Kondisi Kompor Listrik Cabut Colokannya',
  'Cek Kondisi Kipas Angin, AC dalam keadaan OFF',

  'Hp Kasir dalam keadaan Off atau Airplane Mode',
  'Laporan ke Grup WA, jika ada hal yang perlu perbaikan'
];
var KBR = [
  'Mixer Bersih','Kompor Bersih','Meja masak bersih',
  'Alat masak dan makan bersih','Sink Cucian Piring Bersih',
  'Teras Bagian Depan Bersih (Sapu dan pel)',
  'Area Sitting Customer (Sapu dan pel)',
  'Meja Customer dan Kursi','Meja Kasir',
  'Peralatan di atas meja Kasir dan Bar',
  'Perlengkapan di atas meja Kasir dan Bar'
];
var BAHAN = [
  {k:'BAHAN ADONAN',n:'Adonan Mentah Masuk',s:'porsi'},
  {k:'BAHAN ADONAN',n:'Sisa Adonan Mentah',s:'porsi'},
  {k:'BAHAN ADONAN',n:'__FOTO__Endingan Adonan Mateng',s:'foto',foto:'foto_adonan_mateng'},
  {k:'JELLY DKK (gram)',n:'Sagu Mutiara',s:'gr'},
  {k:'JELLY DKK (gram)',n:'Jelly Hijau',s:'gr'},
  {k:'JELLY DKK (gram)',n:'Jelly Cincau',s:'gr'},
  {k:'JELLY DKK (gram)',n:'Jelly Kelapa',s:'gr'},
  {k:'JELLY DKK (gram)',n:'Selasih Mateng',s:'gr'},
  {k:'JELLY DKK (gram)',n:'Selasih Mentah',s:'gr'},
  {k:'JELLY DKK (gram)',n:'__FOTO__Foto Keadaan Semua Bahan Es Teler',s:'foto',foto:'foto_bahan_esteler'},
  {k:'BUAH-BUAHAN (gram)',n:'Nangka',s:'gr'},
  {k:'BUAH-BUAHAN (gram)',n:'Alpukat',s:'gr'},
  {k:'BUAH-BUAHAN (gram)',n:'Mangga',s:'gr'},
  {k:'BUAH-BUAHAN (gram)',n:'Durian',s:'gr'},
  {k:'BUAH-BUAHAN (gram)',n:'__FOTO__Foto Semua Buah',s:'foto',foto:'foto_semua_buah'},
  {k:'BAKSO & PELENGKAP',n:'Bakso',s:'porsi'},
  {k:'BAKSO & PELENGKAP',n:'Kwetiau',s:'gr'},
  {k:'BAKSO & PELENGKAP',n:'Sambel',s:'gr'},
  {k:'BAKSO & PELENGKAP',n:'Garam',s:'gr'},
  {k:'BAKSO & PELENGKAP',n:'Penyedap Rasa',s:'gr'},
  {k:'BANGLADESH',n:'Bumbu Bangladesh',s:'pcs'},

  {k:'BANGLADESH',n:'Telur Omega',s:'butir'},
  {k:'BANGLADESH',n:'Bawang Goreng',s:'gr'},
  {k:'BANGLADESH',n:'Nori',s:'lbr'},
  {k:'BANGLADESH',n:'Sawi',s:'gr'},
  {k:'BANGLADESH',n:'Saos',s:'gr'},
  {k:'BANGLADESH',n:'Totole',s:'gr'},
  {k:'BANGLADESH',n:'Keju',s:'gr'},
  {k:'BANGLADESH',n:'Sosis',s:'pcs'},
  {k:'BUBUK PURE',n:'Matcha',s:'gr'},
  {k:'BUBUK PURE',n:'Coklat',s:'gr'},
  {k:'BUBUK PURE',n:'Taro',s:'gr'},
  {k:'BUBUK PURE',n:'Strawberry',s:'gr'},
  {k:'BUBUK PURE',n:'Kopi',s:'gr'},
  {k:'MATCHA SERIES',n:'Hydro Coco',s:'botol'},
  {k:'MATCHA SERIES',n:'Madu (Sachet)',s:'sachet'},
  {k:'MATCHA SERIES',n:'Lemon',s:'buah'}
];
var KEMASAN = [
  {n:'Cup Medium',s:'pcs'},{n:'Cup Jumbo',s:'pcs'},
  {n:'Sedotan Boba',s:'pcs'},{n:'Sedotan Kecil',s:'pcs'},
  {n:'Paper Bowl & Tutup',s:'pcs'},{n:'Paper Lunch',s:'pcs'},
  {n:'Sumpit',s:'pcs'},{n:'Sendok',s:'pcs'},
  {n:'Kertas Thermal',s:'lembar'},{n:'Plastik 24',s:'pcs'},
  {n:'Plastik Satuan',s:'pcs'},{n:'Plastik Cup Seal',s:'pcs'},
  {n:'Tutup Cup Cembung',s:'pcs'},{n:'Solasi Kecil',s:'pcs'},
  {n:'Tissue',s:'pcs'},{n:'Trash Bag',s:'pcs'}
];

// ── RENDER ────────────────────────────────────────────────────
function render() {
  document.getElementById('tb-info').textContent = session.user.nama + ' · ' + session.outletNama;
  document.getElementById('tb-step').textContent = (step+1) + '/5';
  document.querySelectorAll('.step-tab').forEach(function(t) {
    var s = parseInt(t.dataset.s);
    t.classList.remove('active','done');
    if (s === step) t.classList.add('active');
    else if (s < step) t.classList.add('done');
  });
  document.getElementById('btn-prev').style.display = step > 0 ? '' : 'none';
  var nb = document.getElementById('btn-next');
  if (step === 4) {
    nb.textContent = '✓ Kirim Semua Laporan';
    nb.className = 'btn btn-sc btn-lg btn-full';
  } else {
    nb.textContent = 'Lanjut →';
    nb.className = 'btn btn-am btn-lg btn-full';
  }
  nb.disabled = false;
  var mc = document.getElementById('mc');
  if (step===0) mc.innerHTML = renderSOP();
  else if (step===1) mc.innerHTML = renderSales();
  else if (step===2) mc.innerHTML = renderBahan();
  else if (step===3) mc.innerHTML = renderKemasan();
  else mc.innerHTML = renderRingkasan();
  mc.scrollTop = 0;
  bindAll();
}

function prog(pct) {
  return '<div class="prog"><div class="prog-bar" style="width:'+pct+'%"></div></div>';
}

function uploadBox(id, label, fileKey) {
  var hasFile = fotoFiles[fileKey];
  return '<div class="fg"><label class="fl">'+label+'</label>' +
    '<div class="upload-box'+(hasFile?' has-file':'')+'" id="ub-'+fileKey+'">' +
    '<input type="file" accept="image/*" capture="environment" data-fkey="'+fileKey+'" onchange="onFileChange(this.dataset.fkey,this)">' +
    '<div class="upload-icon">'+(hasFile?'✅':'📷')+'</div>' +
    '<div class="upload-label">'+(hasFile?'Foto dipilih':'Tap untuk foto / pilih file')+'</div>' +
    (hasFile?'<div class="upload-name">'+fotoFiles[fileKey].name+'</div>':'') +
    '</div></div>';
}

function onFileChange(key, input) {
  if (input.files && input.files[0]) {
    fotoFiles[key] = input.files[0];
    var ub = document.getElementById('ub-'+key);
    if (ub) {
      ub.classList.add('has-file');
      ub.querySelector('.upload-icon').textContent = '✅';
      ub.querySelector('.upload-label').textContent = 'Foto dipilih';
      var nm = ub.querySelector('.upload-name');
      if (nm) nm.textContent = input.files[0].name;
      else ub.innerHTML += '<div class="upload-name">'+input.files[0].name+'</div>';
    }
  }
}

// ── STEP 0: SOP ───────────────────────────────────────────────
function renderSOP() {
  var h = prog(20);
  h += '<div class="sec">Cek Closingan</div><div class="card"><div style="padding:0">';
  CEK.forEach(function(item) {
    var on = D.sop.cek[item] || false;
    h += chkRow(item,'cek',on);
  });
  h += '</div></div>';
  h += '<div class="sec">Kondisi Kebersihan</div><div class="card"><div style="padding:0">';
  KBR.forEach(function(item) {
    var on = D.sop.kebersihan[item] || false;
    h += chkRow(item,'kbr',on);
  });
  h += '</div></div>';
  h += uploadBox('fo1','Foto Absen Pulang Timestamp','foto_absen_pulang');
  h += uploadBox('fo2','Foto Kedai Tutup Timestamp','foto_kedai_tutup');
  h += '<div class="sec">Berita Acara</div>';
  h += '<div class="card"><div class="card-body"><textarea class="ft" id="sop_ba" placeholder="Catatan kondisi kedai, hal yang perlu dilaporkan...">'+(D.sop.berita||'')+'</textarea></div></div>';
  var c1=Object.values(D.sop.cek).filter(Boolean).length;
  var c2=Object.values(D.sop.kebersihan).filter(Boolean).length;
  h += counter(c1+'/'+CEK.length+' SOP · '+c2+'/'+KBR.length+' Kebersihan');
  return h;
}

function chkRow(item, type, on) {
  var safe = item.replace(/'/g,'&apos;').replace(/"/g,'&quot;');
  return '<div class="chk" onclick="toggleChk(\''+type+'\',\''+safe+'\',this)">' +
    '<div class="chk-box'+(on?' on':'')+'">'+( on?'<span style="color:var(--gn);font-size:13px">✓</span>':'' )+'</div>' +
    '<div class="chk-lbl'+(on?' on':'')+'">'+ item +'</div></div>';
}

function toggleChk(type, item, el) {
  var realItem = item.replace(/&apos;/g,"'").replace(/&quot;/g,'"');
  if (type==='cek') D.sop.cek[realItem] = !D.sop.cek[realItem];
  else D.sop.kebersihan[realItem] = !D.sop.kebersihan[realItem];
  var on = type==='cek' ? D.sop.cek[realItem] : D.sop.kebersihan[realItem];
  var box = el.querySelector('.chk-box');
  var lbl = el.querySelector('.chk-lbl');
  box.classList.toggle('on', on);
  lbl.classList.toggle('on', on);
  box.innerHTML = on ? '<span style="color:var(--gn);font-size:13px">✓</span>' : '';
  var c1=Object.values(D.sop.cek).filter(Boolean).length;
  var c2=Object.values(D.sop.kebersihan).filter(Boolean).length;
  var ct = document.getElementById('counter');
  if(ct) ct.textContent = c1+'/'+CEK.length+' SOP · '+c2+'/'+KBR.length+' Kebersihan';
}

// ── STEP 1: SALES ─────────────────────────────────────────────
function renderSales() {
  var h = prog(40);
  h += '<div class="sec">Modal & Pengeluaran</div>';
  h += '<div class="card"><div class="card-body">';
  h += autoField('Modal Awal (Rp)','sales_modal', D.sales.modal, autoModal>0);
  h += autoField('Pengeluaran Tunai (Rp)','sales_pen', D.sales.pengeluaran, autoPengeluaran>0);
  h += '</div></div>';

  h += '<div class="sec">Rincian Omset</div>';
  h += '<div class="card"><div class="card-body">';
  h += autoField('Total Omset Penjualan di Kedai (Rp)','sales_omset', D.sales.omset, autoOmset>0);
  h += '</div></div>';

  h += '<div class="card"><div class="card-head">Breakdown Pembayaran</div><div class="card-body">';
  h += '<div class="fr2">';
  h += autoField('QRIS (Rp)','sales_qris', D.sales.qris, autoQris>0);
  h += numField('Shopee (Rp)','sales_shopee', D.sales.shopee);
  h += '</div><div class="fr2">';
  h += numField('GoFood (Rp)','sales_gofood', D.sales.gofood);
  h += numField('GrabFood (Rp)','sales_grabfood', D.sales.grabfood);
  h += '</div><div class="fr2">';
  h += numField('QPON (Rp)','sales_qpon', D.sales.qpon);
  h += numField('Uang Fisik di Laci (Rp)','sales_fisik', D.sales.fisik);
  h += '</div></div></div>';

  h += uploadBox('fo3','Upload Catatan Manual (Foto)','foto_catatan_manual');

  h += '<div class="sec">Berita Acara</div>';
  h += '<div class="card"><div class="card-body"><textarea class="ft" id="sales_ba" placeholder="Catatan khusus penjualan hari ini...">'+(D.sales.berita||'')+'</textarea></div></div>';

  var sisa = (parseInt(D.sales.omset)||0) + (parseInt(D.sales.modal)||0) - (parseInt(D.sales.qris)||0) - (parseInt(D.sales.pengeluaran)||0);
  h += '<div class="sumbox">' +
    sumRow('Modal Awal', fmt(D.sales.modal||0), '') +
    sumRow('Total Omset Kedai', fmt(D.sales.omset||0), 'var(--am)') +
    sumRow('Pengeluaran Tunai', '- '+fmt(D.sales.pengeluaran||0), 'var(--rd)') +
    '<div class="sumrow sumgrand"><span>Uang Fisik Harus Ada</span><span style="color:'+(sisa>=0?'var(--gn)':'var(--rd)')+'">'+fmt(sisa)+'</span></div>' +
    '</div>';

  if (autoOmset > 0 || autoModal > 0 || autoPengeluaran > 0) {
    h += '<div style="background:var(--gnd);border:1px solid var(--gn);border-radius:var(--rsm);padding:10px 13px;font-size:12px;color:var(--gn);font-family:var(--mono)">✓ Omset, modal, dan pengeluaran diisi otomatis dari data POS hari ini</div>';
  }
  return h;
}

function autoField(label, id, val, isAuto) {
  return '<div class="fg"><label class="fl">'+label+(isAuto?' <span style="color:var(--gn);font-weight:400">(otomatis dari POS)</span>':'')+'</label>' +
    '<input type="number" class="fi'+(isAuto?' fi-auto':'')+'" id="'+id+'" value="'+(val||'')+'" placeholder="0" inputmode="numeric"'+(isAuto?' title="Terisi otomatis dari transaksi POS"':'')+'/></div>';
}
function numField(label, id, val) {
  return '<div class="fg"><label class="fl">'+label+'</label><input type="number" class="fi" id="'+id+'" value="'+(val||'')+'" placeholder="0" inputmode="numeric"/></div>';
}
function sumRow(l, v, color) {
  return '<div class="sumrow"><span class="l">'+l+'</span><span class="v"'+(color?' style="color:'+color+'"':'')+'>'+v+'</span></div>';
}

// ── STEP 2: BAHAN ─────────────────────────────────────────────
function renderBahan() {
  var h = prog(60);
  var lastKat = '';
  var totalStock = 0;
  BAHAN.forEach(function(item) {
    if (item.s === 'foto') return; // skip foto untuk count
    totalStock++;
  });
  BAHAN.forEach(function(item) {
    if (item.k !== lastKat) {
      if (lastKat !== '') h += '</div></div>';
      h += '<div class="sec">'+item.k+'</div><div class="card"><div style="padding:0">';
      lastKat = item.k;
    }
    if (item.s === 'foto') {
      var isFoto = fotoFiles[item.foto];
      var realLabel = item.n.replace('__FOTO__','');
      var fk = item.foto;
      h += '<div style="padding:12px 13px;border-bottom:1px solid var(--b)">' +
        '<div class="fl" style="margin-bottom:8px">'+realLabel+'</div>' +
        '<div class="upload-box'+(isFoto?' has-file':'')+'" id="ub-'+fk+'">' +
        '<input type="file" accept="image/*" capture="environment" data-fkey="'+fk+'" onchange="onFileChange(this.dataset.fkey,this)">' +
        '<div class="upload-icon">'+(isFoto?'✅':'📷')+'</div>' +
        '<div class="upload-label">'+(isFoto?'Foto dipilih':'Tap untuk foto')+'</div>' +
        (isFoto?'<div class="upload-name">'+fotoFiles[fk].name+'</div>':'') +
        '</div></div>';
    } else {
      var val = D.bahan[item.n] || '';
      h += stockRow(item.n, item.s, val, 'bahan');
    }
  });
  if (lastKat !== '') h += '</div></div>';
  var filled = Object.keys(D.bahan).filter(function(k){return D.bahan[k]!=='';}).length;
  var f1 = fotoFiles['foto_adonan_mateng'] ? 1 : 0;
  var f2 = fotoFiles['foto_bahan_esteler'] ? 1 : 0;
  var f3 = fotoFiles['foto_semua_buah'] ? 1 : 0;
  h += counter(filled+'/'+totalStock+' item · '+(f1+f2+f3)+'/3 foto');
  return h;
}

// ── STEP 3: KEMASAN ───────────────────────────────────────────
function renderKemasan() {
  var h = prog(80);
  h += '<div class="sec">Hitung Satuan</div><div class="card"><div style="padding:0">';
  KEMASAN.forEach(function(item) {
    var val = D.kemasan[item.n] || '';
    h += stockRow(item.n, item.s, val, 'kemasan');
  });
  h += '</div></div>';
  var filled = Object.keys(D.kemasan).filter(function(k){return D.kemasan[k]!=='';}).length;
  h += counter(filled+'/'+KEMASAN.length+' item diisi');
  return h;
}

function stockRow(nama, sat, val, type) {
  var safe = nama.replace(/'/g,'&apos;').replace(/&/g,'&amp;');
  return '<div class="stock-row"><div><div class="stock-name">'+nama+'</div><div class="stock-unit">'+sat+'</div></div>' +
    '<input type="number" class="stock-inp" data-k="'+safe+'" data-t="'+type+'" value="'+val+'" placeholder="0" inputmode="numeric"></div>';
}

// ── STEP 4: RINGKASAN ─────────────────────────────────────────
function renderRingkasan() {
  var h = prog(100);
  var c1=Object.values(D.sop.cek).filter(Boolean).length;
  var c2=Object.values(D.sop.kebersihan).filter(Boolean).length;
  var b=Object.keys(D.bahan).filter(function(k){return D.bahan[k]!=='';}).length;
  var km=Object.keys(D.kemasan).filter(function(k){return D.kemasan[k]!=='';}).length;
  var f1=fotoFiles['foto_absen_pulang'];
  var f2=fotoFiles['foto_kedai_tutup'];
  var f3=fotoFiles['foto_catatan_manual'];

  h += '<div class="sec">Status Laporan</div>';
  h += '<div class="rg">' +
    rBox('SOP Closing',c1+'/'+CEK.length,c1===CEK.length) +
    rBox('Kebersihan',c2+'/'+KBR.length,c2===KBR.length) +
    rBox('Stock Bahan',b+'/'+BAHAN.length,b===BAHAN.length) +
    rBox('Stock Kemasan',km+'/'+KEMASAN.length,km===KEMASAN.length) +
    rBox('Foto Absen Pulang',f1?'✓ Ada':'✗ Kosong',!!f1) +
    rBox('Foto Kedai Tutup',f2?'✓ Ada':'✗ Kosong',!!f2) +
    rBox('Catatan Manual',f3?'✓ Ada':'- Opsional',!!f3) +
    rBox('Foto Adonan',fotoFiles["foto_adonan_mateng"]?'✓ Ada':'✗ Kosong',!!fotoFiles["foto_adonan_mateng"]) +
    rBox('Foto Bahan Teler',fotoFiles["foto_bahan_esteler"]?'✓ Ada':'✗ Kosong',!!fotoFiles["foto_bahan_esteler"]) +
    rBox('Foto Buah',fotoFiles["foto_semua_buah"]?'✓ Ada':'✗ Kosong',!!fotoFiles["foto_semua_buah"]) +
    '</div>';

  h += '<div class="sec">Rekap Sales</div>';
  var sisa = (parseInt(D.sales.omset)||0) + (parseInt(D.sales.modal)||0) - (parseInt(D.sales.qris)||0) - (parseInt(D.sales.pengeluaran)||0);
  h += '<div class="sumbox">' +
    sumRow('Modal Awal', fmt(D.sales.modal||0),'') +
    sumRow('Omset Kedai', fmt(D.sales.omset||0),'var(--am)') +
    sumRow('QRIS', fmt(D.sales.qris||0),'') +
    sumRow('Shopee', fmt(D.sales.shopee||0),'') +
    sumRow('GoFood', fmt(D.sales.gofood||0),'') +
    sumRow('GrabFood', fmt(D.sales.grabfood||0),'') +
    sumRow('QPON', fmt(D.sales.qpon||0),'') +
    sumRow('Uang Fisik', fmt(D.sales.fisik||0),'') +
    sumRow('Pengeluaran Tunai','- '+fmt(D.sales.pengeluaran||0),'var(--rd)') +
    '<div class="sumrow sumgrand"><span>Uang Fisik Harus Ada</span><span style="color:'+(sisa>=0?'var(--gn)':'var(--rd)')+'">'+fmt(sisa)+'</span></div>' +
    '</div>';

  h += '<div style="background:var(--amd);border:1px solid var(--am);border-radius:var(--rsm);padding:12px 14px;font-size:12px;color:var(--am);margin-top:4px">' +
    '⚠️ Pastikan semua data benar. Setelah dikirim tidak bisa diubah.</div>';
  return h;
}

function rBox(label, val, done) {
  return '<div class="rb" style="border-color:'+(done?'var(--gn)':'var(--b2)')+'">'+
    '<div class="rl">'+label+'</div>' +
    '<div class="rv" style="color:'+(done?'var(--gn)':'var(--am)')+'">'+val+'</div></div>';
}
function counter(text) {
  return '<div style="text-align:center;font-size:12px;color:var(--tx2);font-family:var(--mono);padding:8px 0" id="counter">'+text+'</div>';
}
function fmt(n) { return 'Rp '+Math.round(n||0).toLocaleString('id-ID'); }

// ── BIND EVENTS ───────────────────────────────────────────────
function bindAll() {
  document.querySelectorAll('.stock-inp').forEach(function(inp) {
    inp.onchange = function() {
      var t = this.dataset.t;
      var k = this.dataset.k.replace(/&apos;/g,"'").replace(/&amp;/g,'&');
      if (t==='bahan') D.bahan[k] = this.value;
      else D.kemasan[k] = this.value;
    };
  });
  var salesMap = {
    sales_modal:'modal', sales_pen:'pengeluaran', sales_omset:'omset',
    sales_qris:'qris', sales_shopee:'shopee', sales_gofood:'gofood',
    sales_grabfood:'grabfood', sales_qpon:'qpon', sales_fisik:'fisik'
  };
  Object.keys(salesMap).forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.oninput = function() { D.sales[salesMap[id]] = this.value; };
  });
  var sopBa = document.getElementById('sop_ba');
  if (sopBa) sopBa.oninput = function() { D.sop.berita = this.value; };
  var salesBa = document.getElementById('sales_ba');
  if (salesBa) salesBa.oninput = function() { D.sales.berita = this.value; };
}

// ── NAVIGATION ────────────────────────────────────────────────
function saveStep() {
  document.querySelectorAll('.stock-inp').forEach(function(inp) {
    var t = inp.dataset.t;
    var k = inp.dataset.k.replace(/&apos;/g,"'").replace(/&amp;/g,'&');
    if (t==='bahan') D.bahan[k] = inp.value;
    else D.kemasan[k] = inp.value;
  });
  var salesMap = {
    sales_modal:'modal', sales_pen:'pengeluaran', sales_omset:'omset',
    sales_qris:'qris', sales_shopee:'shopee', sales_gofood:'gofood',
    sales_grabfood:'grabfood', sales_qpon:'qpon', sales_fisik:'fisik'
  };
  Object.keys(salesMap).forEach(function(id) {
    var el = document.getElementById(id);
    if (el) D.sales[salesMap[id]] = el.value;
  });
  var e1 = document.getElementById('sop_ba'); if(e1) D.sop.berita = e1.value;
  var e2 = document.getElementById('sales_ba'); if(e2) D.sales.berita = e2.value;
}

function goStep(s) { saveStep(); step = s; render(); }
function prevStep() { saveStep(); if (step > 0) { step--; render(); } }
function nextStep() { saveStep(); if (step < 4) { step++; render(); } else submitAll(); }

// ── SUBMIT — Promise chain, bukan async/await ─────────────────
function submitAll() {
  var btn = document.getElementById('btn-next');
  btn.disabled = true;
  btn.textContent = '⏳ Mengirim...';
  console.log('=== SUBMIT CLOSING ===');
  console.log('Session:', JSON.stringify(session));

  var now = new Date();
  var tgl = now.toISOString().slice(0,10);
  var ts  = now.toISOString();

  var sopP = {
    nama_crew: session.user.nama,
    kedai: session.outletNama,
    outlet_id: session.outletId,
    cek_closing: JSON.stringify(D.sop.cek),
    kebersihan_area: JSON.stringify(D.sop.kebersihan),
    berita_acara: D.sop.berita,
    foto_absen_url: fotoFiles['foto_absen_pulang'] ? fotoFiles['foto_absen_pulang'].name : '',
    foto_kedai_url: fotoFiles['foto_kedai_tutup'] ? fotoFiles['foto_kedai_tutup'].name : '',
    foto_adonan_url: fotoFiles['foto_adonan_mateng'] ? fotoFiles['foto_adonan_mateng'].name : '',
    foto_bahan_esteler_url: fotoFiles['foto_bahan_esteler'] ? fotoFiles['foto_bahan_esteler'].name : '',
    foto_buah_url: fotoFiles['foto_semua_buah'] ? fotoFiles['foto_semua_buah'].name : '',
    submitted_at: ts,
    tgl: tgl
  };

  var salesP = {
    nama_kasir: session.user.nama,
    outlet_id: session.outletId,
    kedai: session.outletNama,
    tgl: tgl,
    modal: parseInt(D.sales.modal)||0,
    pengeluaran_tunai: parseInt(D.sales.pengeluaran)||0,
    omset_kedai: parseInt(D.sales.omset)||0,
    qris: parseInt(D.sales.qris)||0,
    shopee: parseInt(D.sales.shopee)||0,
    gofood: parseInt(D.sales.gofood)||0,
    grabfood: parseInt(D.sales.grabfood)||0,
    qpon: parseInt(D.sales.qpon)||0,
    uang_fisik: parseInt(D.sales.fisik)||0,
    foto_catatan_url: fotoFiles['foto_catatan_manual'] ? fotoFiles['foto_catatan_manual'].name : '',
    berita_acara: D.sales.berita,
    submitted_at: ts
  };

  var bahanP = {
    nama_crew: session.user.nama,
    outlet_id: session.outletId,
    tgl: tgl,
    items: D.bahan,
    foto_adonan_url: fotoFiles['foto_adonan_mateng'] ? fotoFiles['foto_adonan_mateng'].name : '',
    foto_bahan_esteler_url: fotoFiles['foto_bahan_esteler'] ? fotoFiles['foto_bahan_esteler'].name : '',
    foto_buah_url: fotoFiles['foto_semua_buah'] ? fotoFiles['foto_semua_buah'].name : '',
    submitted_at: ts
  };

  var kemasanP = {
    nama_crew: session.user.nama,
    outlet_id: session.outletId,
    tgl: tgl,
    items: D.kemasan,
    submitted_at: ts
  };

  var errors = [];

  // Kirim satu per satu via Promise chain
  console.log('SOP payload:', JSON.stringify(sopP));
  supaPost('sop_closing', sopP)
  .then(function(ok) {
    console.log('sop_closing:', ok);
    if (!ok) errors.push('SOP Closing');
    console.log('Sales payload:', JSON.stringify(salesP));
    return supaPost('report_sales', salesP);
  })
  .then(function(ok) {
    console.log('report_sales:', ok);
    if (!ok) errors.push('Report Sales');
    console.log('Bahan payload:', JSON.stringify(bahanP));
    return supaPost('report_stock_bahan', bahanP);
  })
  .then(function(ok) {
    console.log('report_stock_bahan:', ok);
    if (!ok) errors.push('Stock Bahan');
    console.log('Kemasan payload:', JSON.stringify(kemasanP));
    return supaPost('report_stock_kemasan', kemasanP);
  })
  .then(function(ok) {
    console.log('report_stock_kemasan:', ok);
    if (!ok) errors.push('Stock Kemasan');
    console.log('Errors:', errors);
    if (errors.length === 0) {
      localStorage.removeItem('pos_shift_data');
      showSuccess();
    } else {
      toast('Gagal: ' + errors.join(', '), 'err');
      btn.disabled = false;
      btn.textContent = '✓ Coba Kirim Ulang';
    }
  })
  .catch(function(e) {
    console.error('Submit error:', e);
    toast('Error: ' + e.message, 'err');
    btn.disabled = false;
    btn.textContent = '✓ Coba Kirim Ulang';
  });
}

function supaPost(table, payload) {
  return fetch(SUPA_URL + '/rest/v1/' + table, {
    method: 'POST',
    headers: {
      'apikey': SUPA_KEY,
      'Authorization': 'Bearer ' + SUPA_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify(payload)
  }).then(function(r) {
    if (!r.ok) {
      return r.text().then(function(t) {
        console.error(table + ' error:', t);
        return false;
      });
    }
    return true;
  });
}

function showSuccess() {
  document.getElementById('mc').innerHTML =
    '<div class="success">' +
    '<div class="success-icon">✅</div>' +
    '<div class="success-title">Shift Berhasil Ditutup!</div>' +
    '<div class="success-sub" style="margin-bottom:24px">Semua laporan terkirim ke database.<br>SOP · Sales · Stock Bahan · Stock Kemasan</div>' +
    '<button class="btn btn-gh btn-lg" style="width:280px" onclick="window.location.href=\'index.html\'">← Kembali ke POS</button>' +
    '</div>';
  document.querySelector('.bot').style.display = 'none';
  document.querySelector('.steps').style.display = 'none';
}

function toast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (type ? ' '+type : '');
  clearTimeout(t._t);
  t._t = setTimeout(function(){ t.className=''; }, 3000);
}

render();
</script>
</body>
</html>
