<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>Admin Panel — Teras Nyai</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--bg1:#111;--bg2:#1a1a1a;--bg3:#222;--bg4:#2a2a2a;--b:#2a2a2a;--b2:#333;--tx:#f0ece4;--tx2:#888;--tx3:#555;--am:#f59e0b;--am2:#d97706;--amd:rgba(245,158,11,.12);--gn:#10b981;--gnd:rgba(16,185,129,.12);--rd:#ef4444;--rdd:rgba(239,68,68,.12);--bl:#3b82f6;--bld:rgba(59,130,246,.12);--pu:#8b5cf6;--pud:rgba(139,92,246,.12);--r:12px;--rsm:8px;--font:'Plus Jakarta Sans',sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--font);min-height:100vh}
button{cursor:pointer;font-family:var(--font)}
input,select,textarea{font-family:var(--font)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}

/* LAYOUT */
.shell{display:flex;min-height:100vh;min-height:100dvh}
.sidebar{width:220px;background:var(--bg1);border-right:1px solid var(--b);flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sidebar-logo{padding:20px 16px;border-bottom:1px solid var(--b)}
.sidebar-logo h1{font-size:16px;font-weight:700;color:var(--am)}
.sidebar-logo p{font-size:11px;color:var(--tx3);font-family:var(--mono);margin-top:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 16px;color:var(--tx2);font-size:13px;font-weight:500;cursor:pointer;border-left:3px solid transparent;transition:all .15s}
.nav-item:hover{color:var(--tx);background:var(--bg2)}
.nav-item.active{color:var(--am);background:var(--amd);border-left-color:var(--am)}
.nav-icon{font-size:16px;width:20px;text-align:center}
.sidebar-bottom{margin-top:auto;padding:16px;border-top:1px solid var(--b)}
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{background:var(--bg1);border-bottom:1px solid var(--b);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;flex-shrink:0}
.topbar-title{font-size:16px;font-weight:700}
.topbar-sub{font-size:12px;color:var(--tx2);margin-top:2px}
.content{padding:24px;flex:1;overflow-y:auto}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--b);border-radius:var(--r);margin-bottom:20px;overflow:hidden}
.card-head{padding:14px 18px;border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:12px;font-weight:700;color:var(--am);letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono)}
.card-body{padding:18px}

/* STATS ROW */
.stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--bg2);border:1px solid var(--b);border-radius:var(--r);padding:16px}
.stat-label{font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono);margin-bottom:6px}
.stat-val{font-size:24px;font-weight:700;font-family:var(--mono)}
.stat-sub{font-size:11px;color:var(--tx2);margin-top:4px}

/* TABLE */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;padding:10px 14px;border-bottom:1px solid var(--b);font-family:var(--mono)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--b);font-size:13px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--bg3)}
.tbl-mono{font-family:var(--mono);font-size:12px;color:var(--tx2)}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;font-family:var(--mono)}
.ba{background:var(--amd);color:var(--am)}.bg{background:var(--gnd);color:var(--gn)}.br{background:var(--rdd);color:var(--rd)}.bb{background:var(--bld);color:var(--bl)}.bp{background:var(--pud);color:var(--pu)}

/* BUTTONS */
.btn{border:none;border-radius:var(--rsm);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;cursor:pointer}
.btn-xs{padding:5px 10px;font-size:11px}
.btn-sm{padding:8px 14px;font-size:12px}
.btn-md{padding:11px 18px;font-size:14px}
.btn-lg{padding:13px 20px;font-size:15px}
.btn-amber{background:var(--am);color:#000}.btn-amber:hover{background:var(--am2)}
.btn-ghost{background:var(--bg3);border:1px solid var(--b2);color:var(--tx2)}.btn-ghost:hover{border-color:var(--am);color:var(--am)}
.btn-danger{background:var(--rdd);border:1px solid var(--rd);color:var(--rd)}.btn-danger:hover{background:var(--rd);color:#fff}
.btn-success{background:var(--gnd);border:1px solid var(--gn);color:var(--gn)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* FORMS */
.form-group{margin-bottom:16px}
.form-label{font-size:11px;font-weight:700;color:var(--tx2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;display:block;font-family:var(--mono)}
.form-input,.form-select{width:100%;background:var(--bg3);border:1.5px solid var(--b2);border-radius:var(--rsm);color:var(--tx);font-family:var(--font);font-size:14px;padding:10px 13px;outline:none;transition:border-color .2s;-webkit-appearance:none}
.form-input:focus,.form-select:focus{border-color:var(--am)}
.form-select option{background:var(--bg3)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--bg2);border:1px solid var(--b2);border-radius:var(--r);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg2)}
.modal-title{font-size:15px;font-weight:700}
.modal-close{background:none;border:none;color:var(--tx2);font-size:20px;padding:4px 8px;border-radius:6px}
.modal-close:hover{color:var(--rd)}
.modal-body{padding:20px}
.modal-footer{padding:16px 20px;border-top:1px solid var(--b);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:var(--bg2)}

/* SEARCH */
.search-box{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--b)}
.search-input{flex:1;background:var(--bg3);border:1.5px solid var(--b2);border-radius:var(--rsm);color:var(--tx);font-family:var(--font);font-size:13px;padding:8px 12px;outline:none;transition:border-color .2s}
.search-input:focus{border-color:var(--am)}

/* TOGGLE */
.toggle{position:relative;width:40px;height:22px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:var(--b2);border-radius:22px;transition:.3s;cursor:pointer}
.toggle-slider:before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.3s}
.toggle input:checked + .toggle-slider{background:var(--gn)}
.toggle input:checked + .toggle-slider:before{transform:translateX(18px)}

/* LOGIN */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
.login-box{background:var(--bg2);border:1px solid var(--b);border-radius:var(--r);padding:32px;width:100%;max-width:380px}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo h1{font-size:22px;font-weight:700;color:var(--am)}
.login-logo p{font-size:12px;color:var(--tx2);font-family:var(--mono);margin-top:4px}

/* TOAST */
.toast-wrap{position:fixed;top:20px;right:20px;z-index:100;display:flex;flex-direction:column;gap:8px}
.toast-item{background:var(--bg3);border:1.5px solid var(--b2);border-radius:var(--rsm);padding:11px 16px;font-size:13px;font-family:var(--mono);box-shadow:0 4px 20px rgba(0,0,0,.4);animation:slideIn .2s ease;display:flex;align-items:center;gap:8px}
.toast-item.ok{border-color:var(--gn);color:var(--gn)}
.toast-item.err{border-color:var(--rd);color:var(--rd)}
.toast-item.info{border-color:var(--bl);color:var(--bl)}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}

/* EMPTY */
.empty{text-align:center;padding:48px 20px;color:var(--tx3)}
.empty-icon{font-size:40px;margin-bottom:12px;opacity:.3}
.empty-text{font-size:13px;font-family:var(--mono)}

/* CHIP */
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--b2);border-radius:6px;padding:3px 8px;font-size:11px;font-family:var(--mono);color:var(--tx2)}

/* RESPONSIVE */
@media(max-width:768px){
  .shell{flex-direction:column}
  .sidebar{width:100%;height:auto;position:fixed;bottom:0;left:0;right:0;top:auto;flex-direction:row;border-right:none;border-top:1px solid var(--b);z-index:50;overflow-x:auto;overflow-y:hidden}
  .sidebar-logo{display:none}
  .nav-item{flex-direction:column;gap:3px;padding:8px 6px;font-size:9px;border-left:none;border-top:3px solid transparent;flex-shrink:0;min-width:60px;justify-content:center;align-items:center;text-align:center}
  .nav-item.active{border-left:none;border-top-color:var(--am)}
  .nav-icon{font-size:20px;width:auto}
  .sidebar-bottom{display:none}
  .main{padding-bottom:70px}
  .topbar{padding:10px 14px}
  .topbar-sub{display:none}
  .topbar-title{font-size:14px}
  .form-row,.form-row-3{grid-template-columns:1fr}
  .stats-row{grid-template-columns:1fr 1fr}
  .content{padding:12px}
  .card-head{flex-wrap:wrap;gap:8px}
  .tbl th,.tbl td{padding:9px 10px;font-size:12px}
  .modal{border-radius:16px 16px 0 0;max-height:95vh}
  .overlay{align-items:flex-end;padding:0}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

const SUPA_URL = 'https://xaixkcaeufxesqmdzhuv.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhhaXhrY2FldWZ4ZXNxbWR6aHV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5Njc1NzUsImV4cCI6MjA5NDU0MzU3NX0.nrFYxWfn8kA1JV6wyiW1X6KVRxKJi6yBnMPAGVIPTjY';
const ADMIN_PIN = '9999'; // Ganti PIN admin di sini

const db = {
  async get(table, opts={}) {
    let url = `${SUPA_URL}/rest/v1/${table}?`;
    if (opts.select) url += `select=${encodeURIComponent(opts.select)}&`;
    if (opts.filter) url += `${opts.filter}&`;
    if (opts.order)  url += `order=${opts.order}&`;
    const r = await fetch(url, { headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}` } });
    return r.json();
  },
  async insert(table, data) {
    const r = await fetch(`${SUPA_URL}/rest/v1/${table}`, {
      method:'POST', headers:{ apikey:SUPA_KEY, Authorization:`Bearer ${SUPA_KEY}`, 'Content-Type':'application/json', Prefer:'return=representation' },
      body: JSON.stringify(data)
    });
    return r.json();
  },
  async update(table, id, data) {
    const r = await fetch(`${SUPA_URL}/rest/v1/${table}?id=eq.${id}`, {
      method:'PATCH', headers:{ apikey:SUPA_KEY, Authorization:`Bearer ${SUPA_KEY}`, 'Content-Type':'application/json', Prefer:'return=representation' },
      body: JSON.stringify(data)
    });
    return r.json();
  },
  async del(table, id) {
    const r = await fetch(`${SUPA_URL}/rest/v1/${table}?id=eq.${id}`, {
      method:'DELETE', headers:{ apikey:SUPA_KEY, Authorization:`Bearer ${SUPA_KEY}` }
    });
    return r.ok;
  },
  async count(table, filter='') {
    const url = `${SUPA_URL}/rest/v1/${table}?select=id${filter?'&'+filter:''}`;
    const r = await fetch(url, { headers: { apikey:SUPA_KEY, Authorization:`Bearer ${SUPA_KEY}`, Prefer:'count=exact' } });
    const ct = r.headers.get('content-range');
    return ct ? parseInt(ct.split('/')[1]) : 0;
  }
};

const fmt = n => 'Rp ' + Math.round(n||0).toLocaleString('id-ID');
const uid = () => Math.random().toString(36).slice(2,9).toUpperCase();

// ── TOAST ─────────────────────────────────────────────────────
function ToastContainer({ toasts }) {
  return <div className="toast-wrap">{toasts.map(t => <div key={t.id} className={`toast-item ${t.type}`}>{t.msg}</div>)}</div>;
}
function useToast() {
  const [toasts, setToasts] = useState([]);
  const show = useCallback((msg, type='info') => {
    const id = Date.now();
    setToasts(t => [...t, {id, msg, type}]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3000);
  }, []);
  return [toasts, show];
}

// ── LOGIN ─────────────────────────────────────────────────────
function LoginPage({ onLogin }) {
  const [pin, setPin] = useState('');
  const [err, setErr] = useState('');
  const handleSubmit = () => {
    if (pin === ADMIN_PIN) onLogin();
    else { setErr('PIN Admin salah'); setPin(''); }
  };
  return (
    <div className="login-wrap">
      <div className="login-box">
        <div className="login-logo">
          <div style={{fontSize:36,marginBottom:8}}>⚙️</div>
          <h1>Admin Panel</h1>
          <p>Teras Nyai POS — v2.0</p>
        </div>
        <div className="form-group">
          <label className="form-label">PIN Admin</label>
          <input className="form-input" type="password" placeholder="Masukkan PIN Admin" value={pin}
            onChange={e => setPin(e.target.value)} onKeyDown={e => e.key==='Enter' && handleSubmit()} autoFocus />
        </div>
        {err && <p style={{color:'var(--rd)',fontSize:12,marginBottom:10,fontFamily:'var(--mono)'}}>{err}</p>}
        <button className="btn btn-amber btn-lg" style={{width:'100%'}} onClick={handleSubmit}>MASUK ADMIN</button>
        <p style={{textAlign:'center',marginTop:12,fontSize:11,color:'var(--tx3)',fontFamily:'var(--mono)'}}>Default PIN: 9999 — ganti di baris ADMIN_PIN</p>
      </div>
    </div>
  );
}

// ── DASHBOARD ────────────────────────────────────────────────
function Dashboard({ toast }) {
  const [stats, setStats] = useState({ outlets:0, karyawan:0, menu:0, trx:0 });
  const [recentTrx, setRecent] = useState([]);

  useEffect(() => {
    Promise.all([
      db.count('outlets','aktif=eq.true'),
      db.count('karyawan','aktif=eq.true'),
      db.count('menu','aktif=eq.true'),
      db.count('transaksi'),
      db.get('transaksi', { select:'id,outlet_id,kasir_nama,total,metode_bayar,tgl,jam,status', order:'created_at.desc', filter:'limit=10' })
    ]).then(([o,k,m,t,rt]) => {
      setStats({ outlets:o, karyawan:k, menu:m, trx:t });
      setRecent(rt||[]);
    });
  }, []);

  const statCards = [
    { label:'Outlet Aktif', val:stats.outlets, color:'var(--am)', icon:'🏪' },
    { label:'Karyawan Aktif', val:stats.karyawan, color:'var(--bl)', icon:'👥' },
    { label:'Item Menu', val:stats.menu, color:'var(--pu)', icon:'🍽️' },
    { label:'Total Transaksi', val:stats.trx, color:'var(--gn)', icon:'🧾' },
  ];

  return (
    <div>
      <div className="stats-row">
        {statCards.map(s => (
          <div key={s.label} className="stat">
            <div style={{fontSize:24,marginBottom:6}}>{s.icon}</div>
            <div className="stat-label">{s.label}</div>
            <div className="stat-val" style={{color:s.color}}>{s.val}</div>
          </div>
        ))}
      </div>
      <div className="card">
        <div className="card-head"><span className="card-title">Transaksi Terbaru</span></div>
        <div style={{overflowX:'auto'}}>
          <table className="tbl">
            <thead><tr><th>ID Transaksi</th><th>Outlet</th><th>Kasir</th><th>Total</th><th>Metode</th><th>Status</th></tr></thead>
            <tbody>
              {recentTrx.length === 0 && <tr><td colSpan={6}><div className="empty"><div className="empty-icon">🧾</div><div className="empty-text">Belum ada transaksi</div></div></td></tr>}
              {recentTrx.map(t => (
                <tr key={t.id}>
                  <td><span className="tbl-mono">{t.id}</span></td>
                  <td><span className="chip">{t.outlet_id}</span></td>
                  <td>{t.kasir_nama}</td>
                  <td><span style={{fontFamily:'var(--mono)',fontWeight:600,color:'var(--am)'}}>{fmt(t.total)}</span></td>
                  <td><span className="badge bb">{t.metode_bayar}</span></td>
                  <td><span className={`badge ${t.status==='LUNAS'?'bg':'br'}`}>{t.status}</span></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ── MENU MANAGER ─────────────────────────────────────────────
function MenuManager({ toast }) {
  const [items, setItems] = useState([]);
  const [search, setSearch] = useState('');
  const [katFilter, setKat] = useState('Semua');
  const [modal, setModal] = useState(null);
  const [saving, setSaving] = useState(false);
  const [form, setForm] = useState({});
  const [showImport, setShowImport] = useState(false);
  const [sheetsUrl, setSheetsUrl] = useState('');
  const [importing, setImporting] = useState(false);
  const [importResult, setImportResult] = useState(null);

  const load = () => db.get('menu', { select:'*', order:'kategori,nama' }).then(d => setItems(d||[]));
  useEffect(() => { load(); }, []);

  const cats = useMemo(() => ['Semua', ...new Set(items.map(m => m.kategori))], [items]);
  const filtered = useMemo(() => items.filter(m => {
    const matchKat = katFilter === 'Semua' || m.kategori === katFilter;
    const matchSearch = !search || m.nama.toLowerCase().includes(search.toLowerCase());
    return matchKat && matchSearch;
  }), [items, katFilter, search]);

  const importFromSheets = async () => {
    if (!sheetsUrl) { toast('Masukkan URL Sheets', 'err'); return; }
    setImporting(true); setImportResult(null);
    try {
      // Ekstrak spreadsheet ID dan gid dari URL
      const idMatch = sheetsUrl.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
      const gidMatch = sheetsUrl.match(/[?&#]gid=([0-9]+)/);
      if (!idMatch) throw new Error('URL Sheets tidak valid. Copy langsung dari address bar browser');
      const sheetId = idMatch[1];
      const gid = gidMatch ? gidMatch[1] : '0';

      // Pakai gviz/tq API — tidak ada CORS issue, designed untuk public access dari browser
      const apiUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&gid=${gid}`;
      const res = await fetch(apiUrl);
      if (!res.ok) throw new Error('Gagal mengakses Sheets (HTTP ' + res.status + ')');
      const text = await res.text();

      // Google gviz API return JSONP dengan comment di depan
      // Format: /*O_o*/\ngoogle.visualization.Query.setResponse({...});
      // Strip semua sebelum { pertama dan setelah } terakhir
      const start = text.indexOf('{');
      const end   = text.lastIndexOf('}');
      if (start < 0 || end < 0) throw new Error('Format response tidak dikenal');
      const jsonStr = text.slice(start, end + 1);
      const json = JSON.parse(jsonStr);

      if (!json.table || !json.table.rows) throw new Error('Data kosong atau format tidak dikenal');

      const rows = json.table.rows;
      const cols = json.table.cols.map(c => c.label.toLowerCase().trim());

      // Deteksi indeks kolom secara fleksibel berdasarkan header
      const iId   = cols.findIndex(c => c.includes('id') || c.includes('kode'));
      const iNama = cols.findIndex(c => c.includes('nama'));
      const iKat  = cols.findIndex(c => c.includes('kategori') || c.includes('kat'));
      const iHrg  = cols.findIndex(c => c.includes('harga') || c.includes('jual'));
      const iHpp  = cols.findIndex(c => c.includes('hpp') || c.includes('modal'));
      const iAkt  = cols.findIndex(c => c.includes('aktif') || c.includes('status'));

      const getVal = (row, idx) => idx >= 0 && row.c[idx] ? String(row.c[idx].v || '').trim() : '';
      const getNum = (row, idx) => idx >= 0 && row.c[idx] ? parseInt(String(row.c[idx].v||'').replace(/[^0-9]/g,'')) || 0 : 0;

      let inserted = 0, updated = 0, skipped = 0;
      for (const row of rows) {
        if (!row.c || !row.c.length) { skipped++; continue; }

        // Fallback: kalau header tidak dikenali, pakai urutan kolom (A,B,C,D,E,F)
        const menuId   = iId   >= 0 ? getVal(row, iId)   : getVal(row, 0);
        const namaMen  = iNama >= 0 ? getVal(row, iNama) : getVal(row, 1);
        const kategori = iKat  >= 0 ? getVal(row, iKat)  : getVal(row, 2);
        const harga    = iHrg  >= 0 ? getNum(row, iHrg)  : getNum(row, 3);
        const hpp      = iHpp  >= 0 ? getNum(row, iHpp)  : getNum(row, 4);
        const aktifStr = iAkt  >= 0 ? getVal(row, iAkt)  : getVal(row, 5);
        const aktif    = aktifStr.toUpperCase() !== 'FALSE' && aktifStr.toLowerCase() !== 'tidak' && aktifStr !== '0';

        if (!menuId || !namaMen || !harga) { skipped++; continue; }

        const menuData = { id: menuId, nama: namaMen, kategori: kategori || 'Lainnya', harga, hpp, aktif };
        const existing = items.find(m => m.id === menuData.id);
        if (existing) {
          await db.update('menu', menuData.id, { nama:menuData.nama, kategori:menuData.kategori, harga:menuData.harga, hpp:menuData.hpp, aktif:menuData.aktif });
          updated++;
        } else {
          await db.insert('menu', menuData);
          inserted++;
        }
      }
      setImportResult({ ok:true, msg:'✓ Import selesai: ' + inserted + ' ditambahkan, ' + updated + ' diupdate, ' + skipped + ' dilewati' });
      load();
      toast('Import Sheets berhasil! ' + (inserted + updated) + ' item diproses', 'ok');
    } catch(e) {
      setImportResult({ ok:false, msg:'✗ ' + e.message });
      toast('Import gagal', 'err');
    }
    setImporting(false);
  };

  const openAdd = () => {
    setForm({ id:'MNU-'+uid(), nama:'', kategori:'', harga:'', hpp:'', aktif:true });
    setModal({ mode:'add' });
  };
  const openEdit = (m) => { setForm({ ...m }); setModal({ mode:'edit' }); };
  const closeModal = () => { setModal(null); setForm({}); };

  const handleSave = async () => {
    if (!form.nama || !form.harga) { toast('Nama dan harga wajib diisi', 'err'); return; }
    setSaving(true);
    const data = { id:form.id, nama:form.nama.trim(), kategori:form.kategori.trim(), harga:+form.harga, hpp:+form.hpp||0, aktif:form.aktif };
    try {
      if (modal.mode === 'add') {
        await db.insert('menu', data);
        toast('Menu berhasil ditambahkan ✓', 'ok');
      } else {
        await db.update('menu', form.id, { nama:data.nama, kategori:data.kategori, harga:data.harga, hpp:data.hpp, aktif:data.aktif });
        toast('Menu berhasil diupdate ✓', 'ok');
      }
      load(); closeModal();
    } catch(e) { toast('Gagal menyimpan', 'err'); }
    setSaving(false);
  };

  const toggleAktif = async (m) => {
    await db.update('menu', m.id, { aktif: !m.aktif });
    toast(`Menu ${m.aktif?'dinonaktifkan':'diaktifkan'}`, m.aktif?'err':'ok');
    load();
  };

  const margin = (m) => m.harga > 0 ? Math.round((m.harga - m.hpp) / m.harga * 100) : 0;

  return (
    <div>
      <div className="card">
        <div className="card-head">
          <span className="card-title">Master Menu ({filtered.length} item)</span>
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-ghost btn-sm" onClick={() => setShowImport(i => !i)}>📥 Import Sheets</button>
            <button className="btn btn-amber btn-sm" onClick={openAdd}>+ Tambah Menu</button>
          </div>
        </div>
        {showImport && (
          <div style={{padding:'14px 18px',borderBottom:'1px solid var(--b)',background:'var(--bg3)'}}>
            <div style={{fontSize:12,color:'var(--tx2)',marginBottom:10,fontFamily:'var(--mono)'}}>
              Paste URL Google Sheets (harus Public/Anyone with link):
            </div>
            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              <input
                className="search-input" style={{flex:1,minWidth:200}}
                placeholder="https://docs.google.com/spreadsheets/d/..."
                value={sheetsUrl}
                onChange={e => setSheetsUrl(e.target.value)}
              />
              <button className="btn btn-success btn-sm" onClick={importFromSheets} disabled={importing}>
                {importing ? '⏳ Memuat...' : '🔄 Import Sekarang'}
              </button>
            </div>
            <div style={{fontSize:11,color:'var(--tx3)',marginTop:8,fontFamily:'var(--mono)'}}>
              Format kolom Sheets: menu_id | nama_menu | kategori | harga_jual | hpp | aktif
            </div>
            {importResult && (
              <div style={{marginTop:8,padding:'8px 12px',borderRadius:6,background: importResult.ok?'var(--gnd)':'var(--rdd)',color:importResult.ok?'var(--gn)':'var(--rd)',fontFamily:'var(--mono)',fontSize:12}}>
                {importResult.msg}
              </div>
            )}
          </div>
        )}
        <div className="search-box">
          <input className="search-input" placeholder="Cari nama menu..." value={search} onChange={e => setSearch(e.target.value)} />
          <select className="form-select" style={{width:140}} value={katFilter} onChange={e => setKat(e.target.value)}>
            {cats.map(c => <option key={c} value={c}>{c}</option>)}

        </div>
        <div style={{overflowX:'auto'}}>

  const [outlets, setOutlets] = useState([]);
  const [filter, setFilter]  = useState({ outlet:'', tgl_dari: new Date().toISOString().slice(0,10), tgl_sampai: new Date().toISOString().slice(0,10) });
  const [loading, setLoad]   = useState(false);

  useEffect(() => {
    db.get('outlets', { select:'id,nama' }).then(d => setOutlets(d||[]));
    loadData();
  }, []);

  const loadData = async () => {
    setLoad(true);
    let f = `tgl=gte.${filter.tgl_dari}&tgl=lte.${filter.tgl_sampai}`;
    if (filter.outlet) f += `&outlet_id=eq.${filter.outlet}`;
    const d = await db.get('transaksi', { select:'*', filter:f, order:'created_at.desc' });
    setTrx(d||[]); setLoad(false);
  };

  const totalPenjualan = trx.reduce((s,t) => s+t.total, 0);
  const totalHPP       = trx.reduce((s,t) => s+t.hpp_total, 0);
  const grossProfit    = trx.reduce((s,t) => s+t.gross_profit, 0);

  return (
    <div>
      <div className="card">
        <div className="card-head"><span className="card-title">Filter Laporan</span></div>
        <div className="card-body">
          <div className="form-row-3">
            <div className="form-group" style={{marginBottom:0}}>
              <label className="form-label">Dari Tanggal</label>
              <input className="form-input" type="date" value={filter.tgl_dari} onChange={e=>setFilter(f=>({...f,tgl_dari:e.target.value}))} />
            </div>
            <div className="form-group" style={{marginBottom:0}}>
              <label className="form-label">Sampai Tanggal</label>
              <input className="form-input" type="date" value={filter.tgl_sampai} onChange={e=>setFilter(f=>({...f,tgl_sampai:e.target.value}))} />
            </div>
            <div className="form-group" style={{marginBottom:0}}>
              <label className="form-label">Outlet</label>
              <select className="form-select" value={filter.outlet} onChange={e=>setFilter(f=>({...f,outlet:e.target.value}))}>
                <option value="">Semua Outlet</option>
                {outlets.map(o => <option key={o.id} value={o.id}>{o.nama}</option>)}
              </select>
            </div>
          </div>
          <div style={{marginTop:14}}>
            <button className="btn btn-amber btn-md" onClick={loadData} disabled={loading}>{loading?'Memuat...':'Tampilkan Laporan'}</button>
          </div>
        </div>
      </div>

      <div className="stats-row">
        <div className="stat"><div className="stat-label">Total Transaksi</div><div className="stat-val" style={{color:'var(--bl)'}}>{trx.length}</div></div>
        <div className="stat"><div className="stat-label">Total Penjualan</div><div className="stat-val" style={{color:'var(--am)',fontSize:18}}>{fmt(totalPenjualan)}</div></div>
        <div className="stat"><div className="stat-label">Total HPP</div><div className="stat-val" style={{color:'var(--rd)',fontSize:18}}>{fmt(totalHPP)}</div></div>
        <div className="stat"><div className="stat-label">Gross Profit</div><div className="stat-val" style={{color:'var(--gn)',fontSize:18}}>{fmt(grossProfit)}</div></div>
      </div>

      <div className="card">
        <div className="card-head">
          <span className="card-title">Data Transaksi ({trx.length})</span>
        </div>
        <div style={{overflowX:'auto'}}>
          <table className="tbl">
            <thead><tr><th>ID</th><th>Tgl</th><th>Outlet</th><th>Kasir</th><th>Total</th><th>HPP</th><th>Profit</th><th>Metode</th><th>Status</th></tr></thead>
            <tbody>
              {trx.length === 0 && <tr><td colSpan={9}><div className="empty"><div className="empty-icon">🧾</div><div className="empty-text">Tidak ada data</div></div></td></tr>}
              {trx.map(t => (
                <tr key={t.id}>
                  <td><span className="tbl-mono" style={{fontSize:11}}>{t.id}</span></td>
                  <td><span className="tbl-mono">{t.tgl}</span></td>
                  <td><span className="chip">{t.outlet_id}</span></td>
                  <td>{t.kasir_nama}</td>
                  <td><span style={{fontFamily:'var(--mono)',color:'var(--am)',fontWeight:600}}>{fmt(t.total)}</span></td>
                  <td><span style={{fontFamily:'var(--mono)',color:'var(--tx2)'}}>{fmt(t.hpp_total)}</span></td>
                  <td><span style={{fontFamily:'var(--mono)',color:'var(--gn)'}}>{fmt(t.gross_profit)}</span></td>
                  <td><span className="badge bb">{t.metode_bayar}</span></td>
                  <td><span className={`badge ${t.status==='LUNAS'?'bg':'br'}`}>{t.status}</span></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ── SYNC MANAGER ─────────────────────────────────────────────
function SyncManager({ toast }) {
  const [appsScriptUrl, setUrl] = React.useState(
    localStorage.getItem('apps_script_url') || ''
  );
  const [syncing, setSyncing] = React.useState({});
  const [results, setResults] = React.useState({});
  const [tglDari, setTglDari] = React.useState(new Date().toISOString().slice(0,10));
  const [tglSampai, setTglSampai] = React.useState(new Date().toISOString().slice(0,10));

  const saveUrl = () => {
    localStorage.setItem('apps_script_url', appsScriptUrl);
    toast('URL Apps Script tersimpan ✓', 'ok');
  };

  const doSync = (type) => {
    if (!appsScriptUrl) { toast('Masukkan URL Apps Script dulu', 'err'); return; }
    setSyncing(s => ({ ...s, [type]: true }));
    setResults(r => ({ ...r, [type]: null }));

    const url = appsScriptUrl + '?action=syncToSheets&type=' + type +
      '&tglDari=' + tglDari + '&tglSampai=' + tglSampai;

    fetch(url)
      .then(r => r.json())
      .then(j => {
        setSyncing(s => ({ ...s, [type]: false }));
        if (j.status === 'ok') {
          setResults(r => ({ ...r, [type]: { ok: true, msg: j.data.message || 'Berhasil' } }));
          toast(type + ' berhasil disync ✓', 'ok');
        } else {
          setResults(r => ({ ...r, [type]: { ok: false, msg: j.message } }));
          toast('Gagal sync ' + type, 'err');
        }
      })
      .catch(e => {
        setSyncing(s => ({ ...s, [type]: false }));
        setResults(r => ({ ...r, [type]: { ok: false, msg: e.message } }));
        toast('Error: ' + e.message, 'err');
      });
  };

  const syncAll = () => {
    ['transaksi','pengeluaran','absensi','sop_opening','sop_closing','report_sales','report_stock'].forEach(t => {
      setTimeout(() => doSync(t), 500);
    });
  };

  const SYNC_ITEMS = [
    { id:'transaksi',     label:'Transaksi Penjualan', desc:'TRX_HEADER + TRX_DETAIL', icon:'🧾' },
    { id:'pengeluaran',   label:'Pengeluaran',          desc:'Sheet PENGELUARAN',        icon:'💸' },
    { id:'absensi',       label:'Absensi Karyawan',     desc:'Sheet ABSENSI',            icon:'👤' },
    { id:'sop_opening',   label:'SOP Opening',          desc:'Sheet SOP_OPENING',        icon:'🌅' },
    { id:'sop_closing',   label:'SOP Closing',          desc:'Sheet SOP_CLOSING',        icon:'🌙' },
    { id:'report_sales',  label:'Report Sales',         desc:'Sheet REPORT_SALES',       icon:'💰' },
    { id:'report_stock',  label:'Report Stock',         desc:'Sheet REPORT_STOCK',       icon:'📦' },
  ];

  return (
    <div>
      <div className="card">
        <div className="card-head"><span className="card-title">Konfigurasi</span></div>
        <div className="card-body">
          <div className="form-group">
            <label className="form-label">URL Apps Script (Web App)</label>
            <div style={{display:'flex',gap:10}}>
              <input className="form-input" style={{fontFamily:'var(--mono)',fontSize:12}}
                placeholder="https://script.google.com/macros/s/.../exec"
                value={appsScriptUrl} onChange={e => setUrl(e.target.value)} />
              <button className="btn btn-amber btn-sm" style={{flex:'0 0 auto'}} onClick={saveUrl}>Simpan</button>
            </div>
          </div>
          <div className="form-row" style={{marginTop:8}}>
            <div className="form-group" style={{marginBottom:0}}>
              <label className="form-label">Dari Tanggal</label>
              <input className="form-input" type="date" value={tglDari} onChange={e => setTglDari(e.target.value)} />
            </div>
            <div className="form-group" style={{marginBottom:0}}>
              <label className="form-label">Sampai Tanggal</label>
              <input className="form-input" type="date" value={tglSampai} onChange={e => setTglSampai(e.target.value)} />
            </div>
          </div>
        </div>
      </div>

      <div className="card">
        <div className="card-head">
          <span className="card-title">Sync ke Google Sheets</span>
          <button className="btn btn-amber btn-sm" onClick={syncAll}>🔄 Sync Semua</button>
        </div>
        {SYNC_ITEMS.map(item => (
          <div key={item.id} className="list-item">
            <div className="list-item-left">
              <div className="title">{item.icon} {item.label}</div>
              <div className="sub">{item.desc}</div>
              {results[item.id] && (
                <div style={{
                  fontSize:11, fontFamily:'var(--mono)', marginTop:4,
                  color: results[item.id].ok ? 'var(--gn)' : 'var(--rd)'
                }}>
                  {results[item.id].ok ? '✓ ' : '✗ '}{results[item.id].msg}
                </div>
              )}
            </div>
            <button
              className={'btn btn-sm ' + (syncing[item.id] ? 'btn-ghost' : 'btn-success')}
              onClick={() => doSync(item.id)}
              disabled={syncing[item.id]}
              style={{flex:'0 0 auto'}}
            >
              {syncing[item.id] ? '⏳ Syncing...' : '↑ Sync'}
            </button>
          </div>
        ))}
      </div>

      <div className="card">
        <div className="card-head"><span className="card-title">Cara Pakai</span></div>
        <div className="card-body" style={{fontSize:13,lineHeight:1.8,color:'var(--tx2)'}}>
          <p>1. Pastikan URL Apps Script sudah diisi dan tersimpan</p>
          <p>2. Pilih rentang tanggal data yang ingin disync</p>
          <p>3. Klik <strong style={{color:'var(--tx)'}}>↑ Sync</strong> per tabel atau <strong style={{color:'var(--tx)'}}>Sync Semua</strong></p>
          <p>4. Data dari Supabase akan ditulis ke Google Sheets otomatis</p>
          <p style={{marginTop:8,color:'var(--am)'}}>⚠️ Sync akan overwrite data yang sudah ada di Sheets untuk rentang tanggal yang sama</p>
        </div>
      </div>
    </div>
  );
}

//  BAHAN BAKU PAGE
// ══════════════════════════════════════════════════════════════
function BahanPage({ toast }) {
  const [items, setItems]   = React.useState([]);
  const [loading, setLoad]  = React.useState(true);
  const [form, setForm]     = React.useState({ nama:'', satuan:'gr', kategori:'Bahan', harga_beli:0, stok_minimal:100 });
  const [editId, setEditId] = React.useState(null);
  const [search, setSearch] = React.useState('');

  const SATUAN = ['gr','ml','pcs','butir','lbr','sachet','botol','lembar','porsi'];
  const KATEGORI = ['Bahan','Kemasan'];

  const load = () => {
    setLoad(true);
    supa.query('bahan_baku', { select:'*', filter:'aktif=eq.true', order:'kategori,nama' })
      .then(d => { setItems(d||[]); setLoad(false); });
  };
  React.useEffect(() => { load(); }, []);

  const save = async () => {
    if (!form.nama.trim()) { toast('Nama bahan wajib diisi', 'err'); return; }
    if (editId) {
      const ok = await supa.update('bahan_baku', editId, form);
      if (ok) { toast('Bahan diperbarui ✓', 'ok'); setEditId(null); setForm({ nama:'', satuan:'gr', kategori:'Bahan', harga_beli:0, stok_minimal:100 }); load(); }
      else toast('Gagal update', 'err');
    } else {
      const id = 'BHN-' + Math.random().toString(36).substr(2,8).toUpperCase();
      const ok = await supa.insert('bahan_baku', { ...form, id });
      if (ok) { toast('Bahan ditambahkan ✓', 'ok'); setForm({ nama:'', satuan:'gr', kategori:'Bahan', harga_beli:0, stok_minimal:100 }); load(); }
      else toast('Gagal simpan', 'err');
    }
  };

  const edit = (item) => {
    setEditId(item.id);
    setForm({ nama:item.nama, satuan:item.satuan, kategori:item.kategori, harga_beli:item.harga_beli||0, stok_minimal:item.stok_minimal||100 });
    window.scrollTo(0,0);
  };

  const hapus = async (id) => {
    if (!confirm('Hapus bahan ini?')) return;
    const ok = await supa.update('bahan_baku', id, { aktif: false });
    if (ok) { toast('Dihapus', 'ok'); load(); }
    else toast('Gagal hapus', 'err');
  };

  const filtered = items.filter(i => i.nama.toLowerCase().includes(search.toLowerCase()));
  const byKat = KATEGORI.map(k => ({ kat:k, items: filtered.filter(i => i.kategori===k) })).filter(g => g.items.length > 0);

  return (
    <div className="page">
      <div className="page-header">
        <div><div className="page-title">🧪 Bahan Baku</div><div className="page-sub">{items.length} bahan terdaftar</div></div>
      </div>

      {/* FORM */}
      <div className="card" style={{marginBottom:16}}>
        <div className="card-head">
          <span className="card-title">{editId ? '✏️ Edit Bahan' : '+ Tambah Bahan'}</span>
          {editId && <button className="btn btn-sm btn-ghost" onClick={() => { setEditId(null); setForm({ nama:'', satuan:'gr', kategori:'Bahan', harga_beli:0, stok_minimal:100 }); }}>✕ Batal</button>}
        </div>
        <div className="card-body">
          <div className="form-row">
            <div className="form-group">
              <label className="form-label">Nama Bahan *</label>
              <input className="form-input" value={form.nama} onChange={e=>setForm({...form,nama:e.target.value})} placeholder="Misal: Jelly Hijau" />
            </div>
            <div className="form-group">
              <label className="form-label">Satuan</label>
              <select className="form-select" value={form.satuan} onChange={e=>setForm({...form,satuan:e.target.value})}>
                {SATUAN.map(s=><option key={s}>{s}</option>)}
              </select>
            </div>
          </div>
          <div className="form-row">
            <div className="form-group">
              <label className="form-label">Kategori</label>
              <select className="form-select" value={form.kategori} onChange={e=>setForm({...form,kategori:e.target.value})}>
                {KATEGORI.map(k=><option key={k}>{k}</option>)}
              </select>
            </div>
            <div className="form-group">
              <label className="form-label">Stok Minimal (alert)</label>
              <input className="form-input" type="number" value={form.stok_minimal} onChange={e=>setForm({...form,stok_minimal:+e.target.value})} />
            </div>
          </div>
          <button className="btn btn-primary btn-full" onClick={save}>{editId?'Simpan Perubahan':'+ Tambah Bahan'}</button>
        </div>
      </div>

      {/* SEARCH */}
      <input className="form-input" placeholder="🔍 Cari bahan..." value={search} onChange={e=>setSearch(e.target.value)} style={{marginBottom:12}} />

      {/* LIST */}
      {loading ? <div className="empty">⏳ Memuat...</div> : byKat.map(g => (
        <div key={g.kat} style={{marginBottom:16}}>
          <div className="section-title">{g.kat} ({g.items.length})</div>
          <div className="card">
            {g.items.map(item => (
              <div key={item.id} className="list-item">
                <div className="list-item-left">
                  <div className="title">{item.nama}</div>
                  <div className="sub">Satuan: {item.satuan} · Min stok: {item.stok_minimal}</div>
                </div>
                <div style={{display:'flex',gap:6,flexShrink:0}}>
                  <button className="btn btn-sm btn-ghost" onClick={()=>edit(item)}>Edit</button>
                  <button className="btn btn-sm btn-danger" onClick={()=>hapus(item.id)}>Hapus</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

//  RESEP PAGE — Bill of Materials per Menu

function ResepPage({ toast }) {
  const [menus, setMenus]   = React.useState([]);
  const [bahans, setBahans] = React.useState([]);
  const [selMenu, setSelMenu] = React.useState(null);
  const [resep, setResep]   = React.useState([]);
  const [form, setForm]     = React.useState({ bahan_id:'', jumlah:'' });
  const [search, setSearch] = React.useState('');
  const [saving, setSaving] = React.useState(false);

  React.useEffect(() => {
    Promise.all([
      supa.query('menu', { select:'id,nama,kategori', filter:'aktif=eq.true', order:'kategori,nama' }),
      supa.query('bahan_baku', { select:'id,nama,satuan,kategori', filter:'aktif=eq.true', order:'kategori,nama' })
    ]).then(([m,b]) => { setMenus(m||[]); setBahans(b||[]); });
  }, []);

  const loadResep = (menuId) => {
    setSelMenu(menuId);
    supa.query('resep', { select:'*,bahan_baku(nama,satuan)', filter:`menu_id=eq.${menuId}`, order:'bahan_baku(kategori),bahan_baku(nama)' })
      .then(d => setResep(d||[]));
  };

  const addBahan = async () => {
    if (!form.bahan_id || !form.jumlah) { toast('Pilih bahan dan isi jumlah', 'err'); return; }
    setSaving(true);
    const bahan = bahans.find(b=>b.id===form.bahan_id);
    const ok = await supa.insert('resep', {
      menu_id: selMenu, bahan_id: form.bahan_id,
      jumlah: parseFloat(form.jumlah), satuan: bahan?.satuan
    });
    if (ok) { toast('Bahan ditambahkan ke resep ✓', 'ok'); setForm({bahan_id:'',jumlah:''}); loadResep(selMenu); }
    else toast('Gagal — mungkin bahan sudah ada di resep ini', 'err');
    setSaving(false);
  };

  const hapusBahan = async (id) => {
    if (!confirm('Hapus bahan dari resep ini?')) return;
    await fetch(`${SUPA_URL}/rest/v1/resep?id=eq.${id}`, {
      method:'DELETE', headers:{ apikey:SUPA_KEY, Authorization:'Bearer '+SUPA_KEY }
    });
    toast('Dihapus dari resep', 'ok');
    loadResep(selMenu);
  };

  const updateJumlah = async (id, val) => {
    await supa.update('resep', id, { jumlah: parseFloat(val) });
  };

  const menuFiltered = menus.filter(m=>m.nama.toLowerCase().includes(search.toLowerCase()));
  const selMenuData  = menus.find(m=>m.id===selMenu);
  const bahanBelumDipakai = bahans.filter(b => !resep.find(r=>r.bahan_id===b.id));

  return (
    <div className="page">
      <div className="page-header">
        <div><div className="page-title">📖 Resep / BOM</div>
          <div className="page-sub">Bill of Materials per menu</div>
        </div>
      </div>

      {!selMenu ? (
        <>
          <input className="form-input" placeholder="🔍 Cari menu..." value={search} onChange={e=>setSearch(e.target.value)} style={{marginBottom:12}} />
          <div className="card">
            {menuFiltered.length === 0 && <div className="empty">Tidak ada menu</div>}
            {menuFiltered.map(m => (
              <div key={m.id} className="list-item" style={{cursor:'pointer'}} onClick={()=>loadResep(m.id)}>
                <div className="list-item-left">
                  <div className="title">{m.nama}</div>
                  <div className="sub">{m.kategori}</div>
                </div>
                <div style={{color:'var(--c-amber)',fontSize:13}}>Edit Resep →</div>
              </div>
            ))}
          </div>
        </>
      ) : (
        <>
          <button className="btn btn-ghost btn-sm" onClick={()=>{setSelMenu(null);setResep([]);}} style={{marginBottom:12}}>
            ← Kembali ke daftar menu
          </button>

          <div className="card" style={{marginBottom:12}}>
            <div className="card-head">
              <span className="card-title">🍽️ {selMenuData?.nama}</span>
              <span className="badge badge-amber">{resep.length} bahan</span>
            </div>
            <div className="card-body" style={{padding:0}}>
              {resep.length === 0 && <div className="empty" style={{padding:'16px 0'}}>Belum ada bahan — tambahkan di bawah</div>}
              {resep.map(r => (
                <div key={r.id} style={{display:'flex',alignItems:'center',padding:'10px 13px',borderBottom:'1px solid var(--c-border)',gap:10}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,fontWeight:500}}>{r.bahan_baku?.nama}</div>
                    <div style={{fontSize:11,color:'var(--c-text2)',fontFamily:"'JetBrains Mono',monospace"}}>{r.satuan}</div>
                  </div>
                  <input type="number" defaultValue={r.jumlah}
                    onBlur={e=>updateJumlah(r.id, e.target.value)}
                    style={{width:72,background:'var(--c-bg3)',border:'1.5px solid var(--c-border2)',borderRadius:7,color:'var(--c-text)',fontFamily:"'JetBrains Mono',monospace",fontSize:14,padding:'6px 10px',textAlign:'center',outline:'none'}} />
                  <button className="btn btn-sm btn-danger" onClick={()=>hapusBahan(r.id)}>✕</button>
                </div>
              ))}
            </div>
          </div>

          {/* Tambah bahan ke resep */}
          <div className="card">
            <div className="card-head"><span className="card-title">+ Tambah Bahan ke Resep</span></div>
            <div className="card-body">
              <div className="form-group">
                <label className="form-label">Pilih Bahan</label>
                <select className="form-select" value={form.bahan_id} onChange={e=>setForm({...form,bahan_id:e.target.value})}>
                  <option value="">-- Pilih Bahan --</option>
                  {['Bahan','Kemasan'].map(kat => (
                    <optgroup key={kat} label={kat}>
                      {bahanBelumDipakai.filter(b=>b.kategori===kat).map(b=>(
                        <option key={b.id} value={b.id}>{b.nama} ({b.satuan})</option>
                      ))}
                    </optgroup>
                  ))}
                </select>
              </div>
              <div className="form-group">
                <label className="form-label">Jumlah per 1 Porsi {form.bahan_id && `(${bahans.find(b=>b.id===form.bahan_id)?.satuan})`}</label>
                <input className="form-input" type="number" value={form.jumlah} onChange={e=>setForm({...form,jumlah:e.target.value})} placeholder="Misal: 150" />
              </div>
              <button className="btn btn-primary btn-full" onClick={addBahan} disabled={saving}>
                {saving ? '⏳ Menyimpan...' : '+ Tambah ke Resep'}
              </button>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
//  STOK PAGE — Monitor & Barang Masuk
// ══════════════════════════════════════════════════════════════
function StokPage({ toast }) {
  const [tab, setTab]       = React.useState('monitor'); // monitor | masuk | log
  const [outlets, setOutlets] = React.useState([]);
  const [bahans, setBahans] = React.useState([]);
  const [stokData, setStok] = React.useState([]);
  const [selOutlet, setSelOutlet] = React.useState('');
  const [loading, setLoad]  = React.useState(false);
  const [form, setForm]     = React.useState({ bahan_id:'', jumlah:'', satuan:'', supplier:'', catatan:'', tgl: new Date().toISOString().slice(0,10) });
  const [log, setLog]       = React.useState([]);

  React.useEffect(() => {
    Promise.all([
      supa.query('outlets', { select:'id,nama', filter:'aktif=eq.true' }),
      supa.query('bahan_baku', { select:'*', filter:'aktif=eq.true', order:'kategori,nama' })
    ]).then(([o,b]) => {
      setOutlets(o||[]);
      setBahans(b||[]);
      if(o&&o.length>0) setSelOutlet(o[0].id);
    });
  }, []);

  React.useEffect(() => {
    if (!selOutlet) return;
    loadStok();
  }, [selOutlet]);

  const loadStok = () => {
    setLoad(true);
    Promise.all([
      supa.query('stok_outlet', { select:'*,bahan_baku(nama,satuan,kategori,stok_minimal)', filter:`outlet_id=eq.${selOutlet}` }),
      supa.query('stok_masuk', { select:'*,bahan_baku(nama,satuan)', filter:`outlet_id=eq.${selOutlet}`, order:'created_at.desc' })
    ]).then(([s,m]) => { setStok(s||[]); setLog(m||[]); setLoad(false); });
  };

  const simpanMasuk = async () => {
    if (!form.bahan_id || !form.jumlah) { toast('Pilih bahan dan isi jumlah', 'err'); return; }
    const bahan = bahans.find(b=>b.id===form.bahan_id);
    const jumlah = parseFloat(form.jumlah);

    // Simpan stok_masuk
    const ok = await supa.insert('stok_masuk', {
      outlet_id: selOutlet, bahan_id: form.bahan_id,
      jumlah, satuan: bahan?.satuan,
      supplier: form.supplier, catatan: form.catatan,
      tgl: form.tgl, dicatat_oleh: 'Admin'
    });

    if (ok) {
      // Update stok_outlet (upsert)
      const existing = stokData.find(s=>s.bahan_id===form.bahan_id);
      if (existing) {
        await supa.update('stok_outlet', existing.id, {
          stok_saat_ini: (existing.stok_saat_ini||0) + jumlah,
          updated_at: new Date().toISOString()
        });
      } else {
        await supa.insert('stok_outlet', {
          outlet_id: selOutlet, bahan_id: form.bahan_id,
          stok_saat_ini: jumlah, stok_kemarin: 0
        });
      }
      // Log
      await supa.insert('stok_log', {
        outlet_id: selOutlet, bahan_id: form.bahan_id,
        jumlah_pakai: jumlah, satuan: bahan?.satuan,
        tipe: 'MASUK', tgl: form.tgl
      });

      toast('Stok masuk tersimpan ✓', 'ok');
      setForm({ bahan_id:'', jumlah:'', satuan:'', supplier:'', catatan:'', tgl: new Date().toISOString().slice(0,10) });
      loadStok();
    } else toast('Gagal simpan', 'err');
  };

  const stokWithBahan = bahans.map(b => {
    const s = stokData.find(x=>x.bahan_id===b.id);
    return { ...b, stok: s?.stok_saat_ini||0, stokKemarin: s?.stok_kemarin||0 };
  });

  const byKat = ['Bahan','Kemasan'].map(k=>({
    kat:k, items: stokWithBahan.filter(b=>b.kategori===k)
  }));

  const alertItems = stokWithBahan.filter(b=>b.stok < b.stok_minimal);

  return (
    <div className="page">
      <div className="page-header">
        <div><div className="page-title">📦 Manajemen Stok</div></div>
      </div>

      {/* Pilih Outlet */}
      <div className="form-group" style={{marginBottom:12}}>
        <label className="form-label">Outlet</label>
        <select className="form-select" value={selOutlet} onChange={e=>setSelOutlet(e.target.value)}>
          {outlets.map(o=><option key={o.id} value={o.id}>{o.nama}</option>)}
        </select>
      </div>

      {/* Tab */}
      <div style={{display:'flex',gap:6,marginBottom:14}}>
        {[['monitor','📊 Monitor Stok'],['masuk','📥 Barang Masuk'],['log','📋 Riwayat']].map(([id,l])=>(
          <button key={id} onClick={()=>setTab(id)}
            style={{padding:'7px 14px',borderRadius:20,fontSize:12,fontWeight:600,cursor:'pointer',border:'1.5px solid var(--c-border2)',fontFamily:"'JetBrains Mono',monospace",
              background:tab===id?'rgba(245,158,11,.12)':'none',
              borderColor:tab===id?'var(--c-amber)':'var(--c-border2)',
              color:tab===id?'var(--c-amber)':'var(--c-text2)'}}>
            {l}
          </button>
        ))}
      </div>

      {/* MONITOR STOK */}
      {tab === 'monitor' && (
        <>
          {alertItems.length > 0 && (
            <div style={{background:'rgba(239,68,68,.1)',border:'1px solid rgba(239,68,68,.3)',borderRadius:10,padding:'10px 13px',marginBottom:12}}>
              <div style={{fontSize:12,fontWeight:700,color:'var(--c-red)',marginBottom:6}}>⚠️ {alertItems.length} bahan hampir habis!</div>
              {alertItems.map(b=>(
                <div key={b.id} style={{fontSize:12,color:'var(--c-red)',fontFamily:"'JetBrains Mono',monospace"}}>
                  • {b.nama}: {b.stok} {b.satuan} (min: {b.stok_minimal})
                </div>
              ))}
            </div>
          )}

          {loading ? <div className="empty">⏳ Memuat...</div> : byKat.map(g=>(
            <div key={g.kat} style={{marginBottom:14}}>
              <div className="section-title">{g.kat}</div>
              <div className="card">
                {/* Header */}
                <div style={{display:'grid',gridTemplateColumns:'1fr 80px 80px 60px',padding:'7px 13px',fontSize:10,fontWeight:700,color:'var(--c-text3)',textTransform:'uppercase',letterSpacing:'.06em',fontFamily:"'JetBrains Mono',monospace",borderBottom:'1px solid var(--c-border)'}}>
                  <span>Bahan</span><span style={{textAlign:'right'}}>Kemarin</span><span style={{textAlign:'right'}}>Sisa</span><span style={{textAlign:'right'}}>Sat.</span>
                </div>
                {g.items.map(b=>{
                  const low = b.stok < b.stok_minimal;
                  const pct = b.stok_minimal > 0 ? Math.min(b.stok/b.stok_minimal,1)*100 : 100;
                  return (
                    <div key={b.id} style={{padding:'9px 13px',borderBottom:'1px solid var(--c-border)',background:low?'rgba(239,68,68,.04)':'transparent'}}>
                      <div style={{display:'grid',gridTemplateColumns:'1fr 80px 80px 60px',alignItems:'center'}}>
                        <span style={{fontSize:13,fontWeight:low?600:400,color:low?'var(--c-red)':'var(--c-text)'}}>{b.nama}</span>
                        <span style={{textAlign:'right',fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:'var(--c-text2)'}}>{b.stokKemarin}</span>
                        <span style={{textAlign:'right',fontFamily:"'JetBrains Mono',monospace",fontSize:13,fontWeight:600,color:low?'var(--c-red)':'var(--c-green)'}}>{b.stok}</span>
                        <span style={{textAlign:'right',fontSize:10,color:'var(--c-text3)',fontFamily:"'JetBrains Mono',monospace"}}>{b.satuan}</span>
                      </div>
                      {/* Mini progress bar */}
                      <div style={{height:2,background:'var(--c-border)',borderRadius:1,marginTop:4,overflow:'hidden'}}>
                        <div style={{height:'100%',width:pct+'%',background:low?'var(--c-red)':'var(--c-green)',borderRadius:1,transition:'width .5s'}}></div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          ))}
        </>
      )}

      {/* BARANG MASUK */}
      {tab === 'masuk' && (
        <div className="card">
          <div className="card-head"><span className="card-title">📥 Input Barang Masuk</span></div>
          <div className="card-body">
            <div className="form-group">
              <label className="form-label">Tanggal</label>
              <input className="form-input" type="date" value={form.tgl} onChange={e=>setForm({...form,tgl:e.target.value})} />
            </div>
            <div className="form-group">
              <label className="form-label">Bahan / Item</label>
              <select className="form-select" value={form.bahan_id} onChange={e=>setForm({...form,bahan_id:e.target.value})}>
                <option value="">-- Pilih Bahan --</option>
                {['Bahan','Kemasan'].map(kat=>(
                  <optgroup key={kat} label={kat}>
                    {bahans.filter(b=>b.kategori===kat).map(b=>(
                      <option key={b.id} value={b.id}>{b.nama} ({b.satuan})</option>
                    ))}
                  </optgroup>
                ))}
              </select>
            </div>
            <div className="form-row">
              <div className="form-group">
                <label className="form-label">Jumlah {form.bahan_id && `(${bahans.find(b=>b.id===form.bahan_id)?.satuan})`}</label>
                <input className="form-input" type="number" value={form.jumlah} onChange={e=>setForm({...form,jumlah:e.target.value})} placeholder="0" />
              </div>
              <div className="form-group">
                <label className="form-label">Supplier</label>
                <input className="form-input" value={form.supplier} onChange={e=>setForm({...form,supplier:e.target.value})} placeholder="Nama supplier" />
              </div>
            </div>
            <div className="form-group">
              <label className="form-label">Catatan</label>
              <input className="form-input" value={form.catatan} onChange={e=>setForm({...form,catatan:e.target.value})} placeholder="Keterangan tambahan..." />
            </div>
            <button className="btn btn-primary btn-full" onClick={simpanMasuk}>📥 Simpan Barang Masuk</button>
          </div>
        </div>
      )}

      {/* RIWAYAT */}
      {tab === 'log' && (
        <div className="card">
          <div className="card-head"><span className="card-title">📋 Riwayat Barang Masuk</span></div>
          {log.length === 0 && <div className="empty">Belum ada riwayat</div>}
          {log.slice(0,50).map(l=>(
            <div key={l.id} className="list-item">
              <div className="list-item-left">
                <div className="title">{l.bahan_baku?.nama}</div>
                <div className="sub">{l.tgl} · {l.supplier||'-'}</div>
              </div>
              <div style={{textAlign:'right',fontFamily:"'JetBrains Mono',monospace",fontSize:14,fontWeight:600,color:'var(--c-green)'}}>
                +{l.jumlah} <span style={{fontSize:10,color:'var(--c-text2)'}}>{l.bahan_baku?.satuan}</span>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
